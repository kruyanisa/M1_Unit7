<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Myths & Legends - Vocabulary</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root {
            --main-theme: #0284c7; 
            --dark-theme: #0369a1;
            --bg-color: #f0f9ff;
            --accent-theme: #f59e0b; 
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 20px 10px;
            background-color: var(--bg-color);
            color: #334155;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #e0f2fe; border: 2px solid var(--main-theme);
            padding: 8px 15px; border-radius: 20px; color: var(--dark-theme); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; width: 100%; max-width: 800px; box-sizing: border-box;
        }
        .btn-switch { background: #f43f5e; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        .header-title {
            font-family: 'Fredoka One', cursive; color: var(--main-theme);
            font-size: 32px; margin: 0 0 5px 0; text-align: center;
        }
        .sub-title { font-weight: 800; color: #0ea5e9; margin-bottom: 5px; font-size: 16px; text-align: center; }
        
        .progress-text { font-weight: 800; font-size: 18px; color: #16a34a; margin-bottom: 20px; text-align: center; }

        .vocab-grid {
            width: 100%; max-width: 800px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding-bottom: 20px;
        }

        /* รองรับมือถือและแท็บเล็ต */
        @media (max-width: 768px) { .vocab-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 500px) { .vocab-grid { grid-template-columns: repeat(2, 1fr); } }

        .vocab-card {
            background: white;
            border: 2px solid #bae6fd;
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(2, 132, 199, 0.1);
            transition: all 0.2s ease;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative;
        }
        .vocab-card:hover { border-color: var(--main-theme); transform: translateY(-3px); box-shadow: 0 8px 15px rgba(2, 132, 199, 0.15); }
        .vocab-card:active { transform: translateY(2px); box-shadow: none; }

        /* สถานะกดฟังแล้ว (ไฮไลท์) */
        .vocab-card.listened {
            background: #dcfce7;
            border-color: #22c55e;
            box-shadow: 0 0 0 2px #22c55e, 0 4px 6px rgba(34, 197, 94, 0.2);
        }
        .vocab-card.listened .word-en { color: #166534; }
        .vocab-card.listened .word-th { color: #15803d; }
        .vocab-card.listened .icon-sound { filter: hue-rotate(250deg); }

        .num-badge {
            position: absolute; top: 8px; left: 8px;
            background: #cbd5e1; color: white; font-family: 'Fredoka One', cursive;
            font-size: 12px; padding: 2px 6px; border-radius: 8px;
        }
        .vocab-card.listened .num-badge { background: #22c55e; }

        .icon-sound { font-size: 24px; margin-bottom: 8px; }
        
        .word-en { font-family: 'Fredoka One', cursive; font-size: 20px; color: var(--dark-theme); margin-bottom: 5px;}
        .word-pos { font-size: 12px; color: #64748b; font-weight: 800; font-style: italic; margin-bottom: 2px;}
        .word-th { font-size: 15px; font-weight: 600; color: #475569; line-height: 1.3;}

        /* Submit Button */
        .btn-action { 
            width: 100%; max-width: 400px; margin: 10px auto 30px auto; background: var(--main-theme); color: white; font-weight: 800; font-size: 18px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 var(--dark-theme); transition: 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; 
        }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }

        /* Modal UI */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240,249,255,0.9); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 30px; text-align: center; width: 100%; max-width: 340px; border: 4px solid var(--main-theme); box-shadow: 0 15px 30px rgba(2, 132, 199, 0.2); box-sizing: border-box; }
        .modal-box input.login-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid var(--main-theme); border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        .modal-box input.login-input:focus { border-color: var(--dark-theme); }
        .score-num { font-size: 60px; font-weight: 900; color: var(--dark-theme); margin: 10px 0; display: block; line-height: 1;}

    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับบัญชี</button>
    </div>

    <h1 class="header-title">Vocabulary (36 Words)</h1>
    <div class="sub-title">Myths & legends 🎧📖</div>
    <div class="progress-text">กดฟังแล้ว: <span id="countDisplay">0</span>/36</div>

    <div class="vocab-grid" id="vocabContainer">
        <!-- การ์ดคำศัพท์จะถูกสร้างด้วย JS -->
    </div>

    <button class="btn-action" onclick="trySubmit()">✅ ส่งคะแนน</button>

    <!-- แทร็กเสียงที่ใช้สลับเล่น -->
    <audio id="audioPlayer"></audio>

    <!-- Modal Login -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="color:var(--dark-theme); margin-top:0; font-size: 24px;">📝 ลงชื่อใช้งาน</h2>
            <p id="modalSub" style="color: #64748b; font-weight: 600; margin-top: 0; font-size: 14px;"></p>
            <input type="text" id="in_name" class="login-input" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" class="login-input" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" class="login-input" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-action" id="btnSubmitLogin" onclick="confirmUser()" style="margin-top:5px; margin-bottom: 0;">🚀 ยืนยัน</button>
        </div>
    </div>

    <!-- Modal Score/Success -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-theme); margin-top:0; font-size: 26px;">🎉 ส่งสำเร็จ!</h2>
            <p style="color: #64748b; font-weight: 600; margin-bottom: 0;">คะแนนทบทวนคำศัพท์ของคุณ</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:30px; color:#bae6fd;">/36</span></span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d; min-height:22px;"></div>
            <button class="btn-action" onclick="closeScoreModal()" style="margin-top:5px; margin-bottom: 0;">✅ ปิดและเริ่มใหม่</button>
        </div>
    </div>

<script>
    const TOPIC_NAME = 'ม.1 Unit 7 Myths legends vocab36';
    const vocabData = [
        { id: 1, word: "appear", pos: "v.", th: "ปรากฏตัว" },
        { id: 2, word: "bury", pos: "v.", th: "ฝัง" },
        { id: 3, word: "fail", pos: "v.", th: "ล้มเหลว" },
        { id: 4, word: "fascinate", pos: "v.", th: "ทำให้หลงใหล" },
        { id: 5, word: "grab", pos: "v.", th: "คว้า, จับ" },
        { id: 6, word: "kill", pos: "v.", th: "ฆ่า" },
        { id: 7, word: "reach", pos: "v.", th: "ไปถึง" },
        { id: 8, word: "save", pos: "v.", th: "ช่วยเหลือ" },
        { id: 9, word: "succeed", pos: "v.", th: "ทำสำเร็จ" },
        { id: 10, word: "travel", pos: "v.", th: "เดินทาง" },
        { id: 11, word: "Alcmene", pos: "n.", th: "อัลก์เมนี<br><span style='font-size:12px; color:#94a3b8;'>(พระมารดาของเฮอร์คิวลีส)</span>" },
        { id: 12, word: "daughter", pos: "n.", th: "ลูกสาว" },
        { id: 13, word: "fact", pos: "n.", th: "ข้อเท็จจริง" },
        { id: 14, word: "fiction", pos: "n.", th: "เรื่องแต่ง" },
        { id: 15, word: "god", pos: "n.", th: "เทพเจ้า" },
        { id: 16, word: "help", pos: "n.", th: "ความช่วยเหลือ" },
        { id: 17, word: "Hercules", pos: "n.", th: "เฮอร์คิวลีส" },
        { id: 18, word: "Iolaus", pos: "n.", th: "ไอโอเลาส์<br><span style='font-size:12px; color:#94a3b8;'>(หลานชายของเฮอร์คิวลีส)</span>" },
        { id: 19, word: "labour", pos: "n.", th: "ภารกิจ, งานหนัก" },
        { id: 20, word: "legend", pos: "n.", th: "ตำนาน" },
        { id: 21, word: "Libya", pos: "n.", th: "ประเทศลิเบีย" },
        { id: 22, word: "monster", pos: "n.", th: "สัตว์ประหลาด" },
        { id: 23, word: "myth", pos: "n.", th: "เรื่องปรัมปรา" },
        { id: 24, word: "nephew", pos: "n.", th: "หลานชาย" },
        { id: 25, word: "place", pos: "n.", th: "สถานที่, การแทนที่<br><span style='font-size:12px; color:#94a3b8;'>(in its place = โผล่ขึ้นมาแทนที่)</span>" },
        { id: 26, word: "princess", pos: "n.", th: "เจ้าหญิง" },
        { id: 27, word: "the Hydra", pos: "n.", th: "ไฮดรา (อสุรกายหลายหัว)" },
        { id: 28, word: "soldier", pos: "n.", th: "ทหาร" },
        { id: 29, word: "spear", pos: "n.", th: "หอก" },
        { id: 30, word: "Zeus", pos: "n.", th: "ซุส<br><span style='font-size:12px; color:#94a3b8;'>(เทพเจ้าสูงสุดของกรีก)</span>" },
        { id: 31, word: "alive", pos: "adj.", th: "ยังมีชีวิตอยู่" },
        { id: 32, word: "brave", pos: "adj.", th: "กล้าหาญ" },
        { id: 33, word: "sad", pos: "adj.", th: "เศร้า" },
        { id: 34, word: "safe", pos: "adj.", th: "ปลอดภัย" },
        { id: 35, word: "young", pos: "adj.", th: "อายุน้อย, วัยรุ่น" },
        { id: 36, word: "still", pos: "adv.", th: "ยังคง" }
    ];

    const MAX_SCORE = vocabData.length;
    let score = 0;
    let isSubmitting = false; 
    let cardStates = {};
    const player = document.getElementById("audioPlayer");

    document.addEventListener("DOMContentLoaded", () => {
        initGame();
        if(localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }
    });

    function initGame() {
        const container = document.getElementById("vocabContainer");
        container.innerHTML = '';
        cardStates = {};
        score = 0;
        document.getElementById("countDisplay").innerText = score;
        
        vocabData.forEach(item => {
            cardStates[item.id] = { played: false };
            
            const card = document.createElement("div");
            card.className = "vocab-card";
            card.id = `card-${item.id}`;
            
            card.innerHTML = `
                <div class="num-badge">${item.id}</div>
                <div class="icon-sound">🎧</div>
                <div class="word-en">${item.word}</div>
                <div class="word-pos">${item.pos}</div>
                <div class="word-th">${item.th}</div>
            `;
            
            card.onclick = () => playVocabAudio(item.id, card);
            container.appendChild(card);
        });
    }

    function playVocabAudio(id, cardElement) {
        player.src = `${id}.mp3`;
        player.play().catch(e => {
            console.log(`ไม่พบไฟล์ ${id}.mp3 (คุณครูต้องนำไฟล์มาอัปโหลดไว้ด้วยนะครับ)`);
        });

        // แอนิเมชันป๊อปอัปนิดนึงตอนกด
        cardElement.style.transform = "scale(0.95)";
        setTimeout(() => { cardElement.style.transform = ""; }, 150);

        if (!cardStates[id].played) {
            cardStates[id].played = true;
            cardElement.classList.add("listened");
            playSoundMiniSuccess();
            
            score = Object.values(cardStates).filter(state => state.played).length;
            document.getElementById("countDisplay").innerText = score;
        }
    }

    function trySubmit() {
        if (score < MAX_SCORE) {
            Swal.fire({
                title: 'ยังฝึกไม่ครบ!',
                html: `หนูกดฟังและอ่านคำศัพท์ไป <b>${score}</b> คำ จากทั้งหมด <b>${MAX_SCORE}</b> คำ<br><br><i>ต้องการส่งคะแนนเท่านี้ หรือกลับไปฟังให้ครบ?</i>`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#f43f5e',
                cancelButtonColor: '#0284c7',
                confirmButtonText: 'ยืนยันส่งคะแนน',
                cancelButtonText: 'กลับไปฟังให้ครบ'
            }).then((result) => {
                if (result.isConfirmed) proceedToLogin();
            });
        } else {
            proceedToLogin();
        }
    }

    function proceedToLogin() {
        if(!localStorage.getItem('studentId')) {
            isSubmitting = true; 
            document.getElementById('modalSub').innerText = `คะแนนที่ทำได้คือ ${score}/${MAX_SCORE}\nลงชื่อเพื่อบันทึกคะแนน`;
            document.getElementById('btnSubmitLogin').innerText = "🚀 บันทึกคะแนน";
            document.getElementById('loginModal').classList.add('active');
        } else {
            submitScore();
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ สลับบัญชี?', text: "เปลี่ยนคนเล่น สถานะการฝึกจะถูกล้างใหม่", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#0284c7', cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if(res.isConfirmed) {
                localStorage.clear(); 
                document.getElementById('userProfile').style.display = 'none';
                
                isSubmitting = false; 
                
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                
                document.getElementById('modalSub').innerText = "ลงชื่อเข้าใช้งานสำหรับนักเรียนคนใหม่ (กดตกลงเพื่อเริ่มฝึก)";
                document.getElementById('btnSubmitLogin').innerText = "🚀 เริ่มฝึกทบทวน";
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        let nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
    });

    function confirmUser() {
        let n = document.getElementById('in_name').value.trim();
        let r = document.getElementById('in_room').value.trim();
        let id = document.getElementById('in_id').value.trim();
        if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัส 5 หลัก', 'warning'); return; }
        
        localStorage.setItem('studentName', n); 
        localStorage.setItem('studentRoom', r); 
        localStorage.setItem('studentId', id);
        
        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id; 
        
        if (isSubmitting) {
            submitScore();
        } else {
            initGame(); 
        }
    }

    function submitScore() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = score;
        const stat = document.getElementById('saveStatus');
        
        if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ ไม่พบไฟล์ตั้งค่า (quiz-config.js)"; 
            return;
        }

        stat.innerText = "⏳ กำลังบันทึกคะแนน...";

        const payload = {
            name: localStorage.getItem('studentName'), 
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'), 
            lesson: TOPIC_NAME, score: score, maxScore: MAX_SCORE
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ บันทึกคะแนนลงระบบเรียบร้อย!"; 
            playSoundSuccess();
        }, 1500);
    }

    function closeScoreModal() {
        document.getElementById('scoreModal').classList.remove('active');
        initGame();
    }

    function playSoundMiniSuccess() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    function playSoundSuccess() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } catch(e) {}
    }
</script>

</body>
</html>
