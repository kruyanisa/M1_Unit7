<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap & Place: The Greatest Briton</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root {
            --main-blue: #0284c7;
            --dark-blue: #1e3a8a;
            --main-red: #dc2626;
            --bg-color: #f0f9ff;
            --success: #16a34a;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 20px 10px;
            background-color: var(--bg-color);
            color: #334155;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #e0f2fe; border: 2px solid var(--main-blue);
            padding: 8px 15px; border-radius: 20px; color: var(--dark-blue); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 900px; box-sizing: border-box;
        }
        .btn-switch { background: #f43f5e; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        .header-title { font-family: 'Fredoka One', cursive; color: var(--main-red); font-size: clamp(24px, 5vw, 32px); margin: 0 0 5px 0; text-align: center; line-height: 1.2;}
        .header-subtitle { font-weight: 800; color: var(--dark-blue); margin-bottom: 5px; font-size: 16px; text-align: center; }
        .instruction-text { color: #64748b; font-size: 15px; text-align: center; margin-bottom: 20px; font-weight: 600;}

        .game-container {
            width: 100%; max-width: 900px;
            background: white; border-radius: 20px; padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.1);
            border: 3px solid #bae6fd; box-sizing: border-box;
        }

        .score-board {
            text-align: right; font-weight: 800; font-size: 18px; color: var(--main-blue); margin-bottom: 15px;
        }

        /* Word Bank */
        .word-bank {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            margin-bottom: 30px; padding: 15px; background: #f8fafc; border-radius: 15px;
            border: 2px dashed #cbd5e1;
        }

        .word-btn {
            background: white; border: 2px solid #94a3b8; border-radius: 10px;
            padding: 10px 15px; font-family: 'Sarabun', sans-serif; font-size: 16px; font-weight: 800;
            color: #334155; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 0 #94a3b8;
        }
        .word-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .word-btn.selected {
            background: #e0f2fe; border-color: var(--main-blue); color: var(--dark-blue);
            box-shadow: 0 4px 0 var(--dark-blue); transform: scale(1.05);
        }
        
        .word-btn.used {
            opacity: 0.4; pointer-events: none; transform: scale(0.95); box-shadow: none;
        }

        /* Sentences */
        .sentence-list {
            display: flex; flex-direction: column; gap: 20px;
        }

        .sentence-item {
            font-size: 18px; font-weight: 600; line-height: 2; color: #1e293b;
            background: #f1f5f9; padding: 15px; border-radius: 12px; border-left: 5px solid var(--main-blue);
        }

        .drop-slot {
            display: inline-block; min-width: 150px; text-align: center;
            background: white; border: 2px dashed #94a3b8; border-radius: 8px;
            padding: 2px 15px; color: #94a3b8; font-weight: 800; font-style: italic;
            cursor: pointer; transition: all 0.2s; margin: 0 5px; vertical-align: middle;
            line-height: 1.5;
        }

        .drop-slot:hover { border-color: var(--main-blue); background: #e0f2fe; }

        .drop-slot.filled {
            background: #dcfce7; border: 2px solid var(--success); color: #15803d;
            font-style: normal; cursor: default;
        }

        .drop-slot.wrong-shake {
            animation: shake 0.4s; border-color: var(--main-red); background: #fee2e2; color: var(--main-red);
        }

        @keyframes shake {
            0% { transform: translateX(0); } 25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); } 75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Submit Button */
        .btn-action { 
            width: 100%; margin-top: 30px; background: var(--main-red); color: white; font-weight: 800; font-size: 18px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #991b1b; transition: 0.1s; display: flex; justify-content: center; align-items: center; 
        }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240,249,255,0.9); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 30px; text-align: center; width: 100%; max-width: 340px; border: 4px solid var(--main-blue); box-shadow: 0 15px 30px rgba(2, 132, 199, 0.2); box-sizing: border-box; }
        .modal-box input.login-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid var(--main-blue); border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        
        .score-num { font-size: 60px; font-weight: 900; color: var(--main-red); margin: 10px 0; display: block; line-height: 1;}
        .btn-submit-modal { width: 100%; padding: 15px; background: var(--main-red); color: white; border: none; border-radius: 15px; font-weight: 800; font-size: 18px; cursor: pointer; box-shadow: 0 4px 0 #991b1b; transition: 0.1s; margin-top: 10px; font-family: 'Sarabun'; }
        .btn-submit-modal:active { transform: translateY(4px); box-shadow: none; }

    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 Switch Account</button>
    </div>

    <h1 class="header-title">The Greatest Briton of all</h1>
    <div class="header-subtitle">Tap & Replace 🧩</div>
    <div class="instruction-text">Tap a name, then tap the correct blank box to replace the bold word.</div>

    <div class="game-container">
        <div class="score-board">Score: <span id="scoreDisplay">0</span> / 6</div>
        
        <!-- Word Bank -->
        <div class="word-bank" id="wordBank">
            <!-- Buttons created by JS -->
        </div>

        <!-- Sentences -->
        <div class="sentence-list" id="sentenceList">
            <!-- Sentences created by JS -->
        </div>

        <button class="btn-action" onclick="trySubmit()">🚀 Submit Score</button>
    </div>

    <!-- Modal Login -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-blue); margin-top:0; font-size: 24px;">📝 Sign In</h2>
            <p id="modalSub" style="color: #64748b; font-weight: 600; margin-top: 0; font-size: 14px;"></p>
            <input type="text" id="in_name" class="login-input" placeholder="First Name - Last Name">
            <input type="text" id="in_room" class="login-input" placeholder="Class/Room (e.g., 1/1)">
            <input type="text" id="in_id" class="login-input" placeholder="Student ID (5 digits)" maxlength="5">
            <button class="btn-submit-modal" onclick="confirmUser()">🚀 Save Score</button>
        </div>
    </div>

    <!-- Modal Score/Success -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-blue); margin-top:0; font-size: 26px;">🎉 Excellent!</h2>
            <p style="color: #64748b; font-weight: 600; margin-bottom: 0;">Your final score is</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:30px; color:#fca5a5;">/6</span></span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d; min-height:22px;"></div>
            <button class="btn-submit-modal" style="background: var(--main-blue); box-shadow: 0 4px 0 var(--dark-blue);" onclick="restartGame()">🔄 Try Again</button>
        </div>
    </div>

<script>
    const TOPIC_NAME = 'M.1 Unit 7 The Greatest Briton - Replace Words';
    const MAX_SCORE = 6;
    
    // Data definition
    const namesData = [
        { id: "david", text: "David Attenborough" },
        { id: "diana", text: "Diana, Princess of Wales" },
        { id: "robert", text: "Robert Baden Powell" },
        { id: "elizabeth", text: "Queen Elizabeth II" },
        { id: "stephen", text: "Stephen Hawking" },
        { id: "winston", text: "Winston Churchill" }
    ];

    const sentencesData = [
        { id: 1, textPre: "1. Working with animals is", boldText: "his", textPost: "job.", correctId: "david" },
        { id: 2, textPre: "2.", boldText: "He", textPost: "founded the world-wide Scout Movement.", correctId: "robert" },
        { id: 3, textPre: "3.", boldText: "This person", textPost: "was a prime minister.", correctId: "winston" },
        { id: 4, textPre: "4.", boldText: "This person", textPost: "had Motor Neurone disease.", correctId: "stephen" },
        { id: 5, textPre: "5.", boldText: "This person's", textPost: "father was a king.", correctId: "elizabeth" },
        { id: 6, textPre: "6.", boldText: "This person", textPost: "died in an accident.", correctId: "diana" }
    ];

    let score = 0;
    let selectedWordObj = null;
    let isSubmitting = false;

    document.addEventListener("DOMContentLoaded", () => {
        initGame();
        if(localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }
    });

    function initGame() {
        score = 0;
        selectedWordObj = null;
        document.getElementById('scoreDisplay').innerText = score;
        
        // Shuffle names array for random positions in Word Bank
        const shuffledNames = [...namesData].sort(() => Math.random() - 0.5);

        // Build Word Bank
        const wordBank = document.getElementById('wordBank');
        wordBank.innerHTML = '';
        shuffledNames.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'word-btn';
            btn.id = `btn-${item.id}`;
            btn.innerText = item.text;
            btn.onclick = () => selectWord(item, btn);
            wordBank.appendChild(btn);
        });

        // Build Sentences
        const sentenceList = document.getElementById('sentenceList');
        sentenceList.innerHTML = '';
        sentencesData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'sentence-item';
            div.innerHTML = `
                ${item.textPre}
                <span class="drop-slot" id="slot-${item.id}" onclick="placeWord('${item.id}', '${item.correctId}')">
                    ${item.boldText}
                </span>
                ${item.textPost}
            `;
            sentenceList.appendChild(div);
        });
    }

    function selectWord(item, btnElement) {
        // Deselect all
        document.querySelectorAll('.word-btn').forEach(b => b.classList.remove('selected'));
        
        // If clicking the same button, just deselect
        if (selectedWordObj && selectedWordObj.id === item.id) {
            selectedWordObj = null;
            return;
        }

        // Select new
        selectedWordObj = { ...item, btnElement };
        btnElement.classList.add('selected');
        playSound('tap');
    }

    function placeWord(slotId, correctId) {
        const slot = document.getElementById(`slot-${slotId}`);
        
        // Ignore if slot is already filled correctly
        if (slot.classList.contains('filled')) return;

        // If no word selected, notify user
        if (!selectedWordObj) {
            slot.classList.add('wrong-shake');
            setTimeout(() => slot.classList.remove('wrong-shake'), 400);
            return;
        }

        if (selectedWordObj.id === correctId) {
            // Correct match
            slot.classList.add('filled');
            slot.innerText = selectedWordObj.text;
            selectedWordObj.btnElement.classList.remove('selected');
            selectedWordObj.btnElement.classList.add('used');
            
            score++;
            document.getElementById('scoreDisplay').innerText = score;
            selectedWordObj = null;
            playSound('correct');
        } else {
            // Wrong match
            slot.classList.add('wrong-shake');
            selectedWordObj.btnElement.classList.remove('selected');
            selectedWordObj = null;
            playSound('wrong');
            
            setTimeout(() => {
                slot.classList.remove('wrong-shake');
            }, 400);
        }
    }

    function trySubmit() {
        if (score < MAX_SCORE) {
            Swal.fire({
                title: 'Incomplete!',
                html: `You have completed <b>${score}</b> out of <b>${MAX_SCORE}</b> sentences.<br><br><i>Do you want to submit this score or keep playing?</i>`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#0284c7',
                confirmButtonText: 'Submit Score',
                cancelButtonText: 'Keep Playing'
            }).then((result) => {
                if (result.isConfirmed) proceedToLogin();
            });
        } else {
            proceedToLogin();
        }
    }

    function proceedToLogin() {
        if(!localStorage.getItem('studentId')) {
            isSubmitting = true; 
            document.getElementById('modalSub').innerText = `Your score is ${score}/${MAX_SCORE}\nPlease sign in to save it.`;
            document.getElementById('loginModal').classList.add('active');
        } else {
            submitScore();
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ Switch Account?', 
            text: "Current progress will be reset.", 
            icon: 'warning',
            showCancelButton: true, 
            confirmButtonColor: '#0284c7', 
            cancelButtonColor: '#94a3b8',
            confirmButtonText: 'Yes, switch', 
            cancelButtonText: 'Cancel'
        }).then((res) => {
            if(res.isConfirmed) {
                localStorage.clear(); 
                document.getElementById('userProfile').style.display = 'none';
                
                isSubmitting = false; 
                
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                
                document.getElementById('modalSub').innerText = "Please sign in to start the activity.";
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        let nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `M.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `M.1/${nums[0]}`;
    });

    function confirmUser() {
        let n = document.getElementById('in_name').value.trim();
        let r = document.getElementById('in_room').value.trim();
        let id = document.getElementById('in_id').value.trim();
        if(!n || !r || id.length !== 5) { Swal.fire('Incomplete Details!', 'Please enter Name, Room, and a 5-digit Student ID.', 'warning'); return; }
        
        localStorage.setItem('studentName', n); 
        localStorage.setItem('studentRoom', r); 
        localStorage.setItem('studentId', id);
        
        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id; 
        
        if (isSubmitting) {
            submitScore();
        } else {
            initGame(); 
        }
    }

    function submitScore() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = score;
        const stat = document.getElementById('saveStatus');
        
        if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ Configuration file not found (quiz-config.js)"; 
            return;
        }

        stat.innerText = "⏳ Saving score...";

        const payload = {
            name: localStorage.getItem('studentName'), 
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'), 
            lesson: TOPIC_NAME, score: score, maxScore: MAX_SCORE
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ Score saved successfully!"; 
            playSound('success');
        }, 1500);
    }

    function restartGame() {
        document.getElementById('scoreModal').classList.remove('active');
        initGame();
    }

    // Web Audio API for Sound Effects
    function playSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'tap') {
                osc.type = "sine";
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'correct') {
                osc.type = "sine";
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'success') {
                osc.type = "sine";
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        } catch(e) {}
    }
</script>

</body>
</html>
