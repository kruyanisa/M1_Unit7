<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocab Match: Culture Corner</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root {
            --main-blue: #0284c7;
            --dark-blue: #1e3a8a;
            --main-orange: #f59e0b;
            --bg-color: #f0f9ff;
            --success: #16a34a;
            --error: #dc2626;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 20px 10px;
            background-color: var(--bg-color);
            color: #334155;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #e0f2fe; border: 2px solid var(--main-blue);
            padding: 8px 15px; border-radius: 20px; color: var(--dark-blue); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 900px; box-sizing: border-box;
        }
        .btn-switch { background: #f43f5e; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        .header-title { font-family: 'Fredoka One', cursive; color: var(--main-blue); font-size: clamp(24px, 5vw, 32px); margin: 0 0 5px 0; text-align: center; line-height: 1.2;}
        .header-subtitle { font-weight: 800; color: var(--main-orange); margin-bottom: 20px; font-size: 18px; text-align: center; }

        .game-container {
            width: 100%; max-width: 900px;
            background: white; border-radius: 20px; padding: 20px 15px;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.1);
            border: 3px solid #bae6fd; box-sizing: border-box;
        }

        .score-board {
            text-align: center; font-weight: 800; font-size: 20px; color: var(--main-blue); 
            margin-bottom: 5px;
        }
        .round-indicator {
            text-align: center; font-weight: 600; font-size: 14px; color: #64748b;
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px dashed #bae6fd;
        }

        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* ซ้ายอังกฤษ ขวาไทย */
            gap: 10px;
            width: 100%;
        }

        .col { display: flex; flex-direction: column; gap: 10px; }
        .col-header { text-align: center; font-family: 'Fredoka One', cursive; color: #64748b; font-size: 16px; margin-bottom: 5px; }

        .word-card {
            background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px;
            padding: 12px 10px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; box-shadow: 0 4px 0 #cbd5e1;
            min-height: 60px; box-sizing: border-box; position: relative;
            user-select: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .word-card:active { transform: translateY(4px); box-shadow: none; }
        
        .word-card.en-card { font-family: 'Fredoka One', cursive; font-size: 16px; color: var(--dark-blue); }
        /* เพิ่ม line-height ให้คำแปลไทยที่โดนตัดบรรทัดดูสวยงาม */
        .word-card.th-card { font-weight: 700; font-size: 15px; color: #475569; justify-content: center; text-align: center; line-height: 1.3;}

        .icon-audio {
            background: #e0f2fe; color: var(--main-blue); width: 30px; height: 30px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            margin-right: 10px; font-size: 14px; flex-shrink: 0;
        }

        .word-pos { font-family: 'Sarabun'; font-size: 12px; font-weight: 800; color: #94a3b8; font-style: italic; margin-left: 5px; }

        /* States */
        .word-card.selected {
            background: #e0f2fe; border-color: var(--main-blue); color: var(--dark-blue);
            box-shadow: 0 4px 0 var(--dark-blue); transform: scale(1.02);
        }
        
        .word-card.matched {
            background: #dcfce7; border-color: var(--success); color: #15803d;
            box-shadow: none; transform: translateY(4px); opacity: 0.6; pointer-events: none;
        }

        .word-card.matched .icon-audio { background: #bbf7d0; color: #166534; }

        .word-card.wrong {
            animation: shake 0.4s; border-color: var(--error); background: #fee2e2; color: var(--error);
        }

        @keyframes shake {
            0% { transform: translateX(0); } 25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); } 75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Modals */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(240,249,255,0.9); backdrop-filter: blur(5px); 
            display: flex; justify-content: center; align-items: center; 
            z-index: 3000; visibility: hidden; opacity: 0; transition: 0.3s; 
            padding: 15px; box-sizing: border-box; 
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        
        .modal-box { 
            background: white; padding: 30px 20px; border-radius: 30px; text-align: center; 
            width: 100%; max-width: 340px; border: 4px solid var(--main-blue); 
            box-shadow: 0 15px 30px rgba(2, 132, 199, 0.2); box-sizing: border-box; 
        }
        .modal-box input.login-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid var(--main-blue); border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        .score-num { font-size: 60px; font-weight: 900; color: var(--main-orange); margin: 10px 0; display: block; line-height: 1;}
        .btn-submit-modal { width: 100%; padding: 15px; background: var(--main-blue); color: white; border: none; border-radius: 15px; font-weight: 800; font-size: 18px; cursor: pointer; box-shadow: 0 4px 0 var(--dark-blue); transition: 0.1s; margin-top: 10px; font-family: 'Sarabun'; }
        .btn-submit-modal:active { transform: translateY(4px); box-shadow: none; }

        @media (max-width: 400px) {
            .word-card { padding: 10px 5px; }
            .word-card.en-card { font-size: 14px; }
            .icon-audio { width: 25px; height: 25px; margin-right: 5px; font-size: 12px;}
            .word-card.th-card { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับบัญชี</button>
    </div>

    <h1 class="header-title">Culture Corner Vocab</h1>
    <div class="header-subtitle">Audio Match Game 🎧🧩</div>

    <div class="game-container">
        <div class="score-board">จับคู่สำเร็จ: <span id="scoreDisplay" style="color:var(--success);">0</span> / 17</div>
        <div class="round-indicator">รอบที่: <span id="roundDisplay">1</span> / 3</div>
        
        <div class="match-grid">
            <div class="col" id="col-en">
                <div class="col-header">English</div>
            </div>
            
            <div class="col" id="col-th">
                <div class="col-header">Thai Meaning</div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <!-- Modal Login -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-blue); margin-top:0; font-size: 24px;">📝 ลงชื่อรับคะแนน</h2>
            <p id="modalSub" style="color: #64748b; font-weight: 600; margin-top: 0; font-size: 14px;"></p>
            <input type="text" id="in_name" class="login-input" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" class="login-input" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" class="login-input" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-submit-modal" onclick="confirmUser()">🚀 ยืนยัน</button>
        </div>
    </div>

    <!-- Modal Score/Success -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-blue); margin-top:0; font-size: 26px;">🎉 สำเร็จแล้ว!</h2>
            <p style="color: #64748b; font-weight: 600; margin-bottom: 0;">คะแนนของคุณคือ</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:30px; color:#fcd34d;">/17</span></span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d; min-height:22px;"></div>
            <button class="btn-submit-modal" style="background: var(--main-orange); box-shadow: 0 4px 0 #b45309;" onclick="restartGame()">🔄 ลองเล่นใหม่อีกครั้ง</button>
        </div>
    </div>

<script>
    const TOPIC_NAME = 'ม.1 Unit 7 culture corner vocab';
    
    // อัปเดตข้อมูลคำศัพท์ พร้อมชื่อไฟล์เสียงเป๊ะๆ และใช้ <br> ขึ้นบรรทัดใหม่ให้คำที่ยาว
    const allVocabData = [
        { id: 1, en: "produce", pos: "v.", th: "ผลิต, สร้าง", audio: "produce.mp3" },
        { id: 2, en: "reign", pos: "v.", th: "ครองราชย์", audio: "reign.mp3" },
        { id: 3, en: "vote", pos: "v.", th: "ลงคะแนนเสียง", audio: "vote.mp3" },
        { id: 4, en: "write", pos: "v.", th: "เขียน,<br>ประพันธ์", audio: "write.mp3" },
        { id: 5, en: "accident", pos: "n.", th: "อุบัติเหตุ", audio: "accident.mp3" },
        { id: 6, en: "Briton", pos: "n.", th: "ชาวอังกฤษ", audio: "Briton.mp3" },
        { id: 7, en: "composer", pos: "n.", th: "นักแต่งเพลง,<br>คีตกวี", audio: "composer.mp3" },
        { id: 8, en: "king", pos: "n.", th: "พระราชา,<br>กษัตริย์", audio: "king.mp3" },
        { id: 9, en: "officer", pos: "n.", th: "นายทหาร,<br>เจ้าหน้าที่", audio: "officer.mp3" },
        { id: 10, en: "politician", pos: "n.", th: "นักการเมือง", audio: "politician.mp3" },
        { id: 11, en: "presenter", pos: "n.", th: "พิธีกร", audio: "presenter.mp3" },
        { id: 12, en: "Prime Minister", pos: "n.", th: "นายกรัฐมนตรี", audio: "Prime_Minister.mp3" },
        { id: 13, en: "public", pos: "n.", th: "ประชาชน,<br>สาธารณชน", audio: "public.mp3" },
        { id: 14, en: "result", pos: "n.", th: "ผลลัพธ์,<br>ผลการตัดสิน", audio: "result.mp3" },
        { id: 15, en: "scientist", pos: "n.", th: "นักวิทยาศาสตร์", audio: "scientist.mp3" },
        { id: 16, en: "let it be", pos: "phr.", th: "ปล่อยมันไป,<br>ช่างมันเถอะ", audio: "let_it_be.mp3" },
        { id: 17, en: "of all time", pos: "phr.", th: "ตลอดกาล", audio: "of_all_time.mp3" }
    ];

    const MAX_SCORE = allVocabData.length;
    const ITEMS_PER_ROUND = 6;
    
    let currentRound = 0;
    let totalScore = 0;
    let roundScore = 0;
    let currentRoundData = [];
    
    let selectedEn = null;
    let selectedTh = null;
    let isSubmitting = false;

    const audioPlayer = document.getElementById('audioPlayer');

    document.addEventListener("DOMContentLoaded", () => {
        initGame();
        if(localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }
    });

    function initGame() {
        totalScore = 0;
        currentRound = 0;
        document.getElementById('scoreDisplay').innerText = totalScore;
        
        // สับเปลี่ยนคำศัพท์ทั้งหมดก่อนแบ่งรอบ
        const shuffledAll = [...allVocabData].sort(() => Math.random() - 0.5);
        
        loadRound(shuffledAll);
    }

    function loadRound(shuffledDataArray) {
        currentRound++;
        roundScore = 0;
        selectedEn = null;
        selectedTh = null;
        
        document.getElementById('roundDisplay').innerText = currentRound;
        
        const startIndex = (currentRound - 1) * ITEMS_PER_ROUND;
        currentRoundData = shuffledDataArray.slice(startIndex, startIndex + ITEMS_PER_ROUND);

        const colEn = document.getElementById('col-en');
        const colTh = document.getElementById('col-th');
        
        colEn.innerHTML = '<div class="col-header">English</div>';
        colTh.innerHTML = '<div class="col-header">Thai Meaning</div>';

        currentRoundData.forEach(item => {
            const btn = document.createElement('div');
            btn.className = 'word-card en-card';
            btn.id = `en-${item.id}`;
            btn.dataset.audio = item.audio; // ฝังชื่อไฟล์เสียงไว้ใน tag
            btn.innerHTML = `
                <div class="icon-audio">🎧</div>
                <div>${item.en} <span class="word-pos">(${item.pos})</span></div>
            `;
            btn.onclick = () => selectEn(item.id, btn);
            colEn.appendChild(btn);
        });

        const shuffledTh = [...currentRoundData].sort(() => Math.random() - 0.5);
        shuffledTh.forEach(item => {
            const btn = document.createElement('div');
            btn.className = 'word-card th-card';
            btn.id = `th-${item.id}`;
            btn.innerHTML = item.th; // ใช้ innerHTML เพื่อให้ <br> ทำงาน
            btn.onclick = () => selectTh(item.id);
            colTh.appendChild(btn);
        });
        
        window.currentShuffledData = shuffledDataArray;
    }

    function selectEn(id, btnElement) {
        const audioFile = btnElement.dataset.audio;
        audioPlayer.src = audioFile;
        audioPlayer.play().catch(e => console.log(`กรุณาอัปโหลดไฟล์ ${audioFile}`));
        
        playSound('tap');

        if(selectedEn) document.getElementById(`en-${selectedEn}`).classList.remove('selected');
        selectedEn = id;
        btnElement.classList.add('selected');
        
        checkMatch();
    }

    function selectTh(id) {
        playSound('tap');

        if(selectedTh) document.getElementById(`th-${selectedTh}`).classList.remove('selected');
        selectedTh = id;
        document.getElementById(`th-${id}`).classList.add('selected');
        
        checkMatch();
    }

    function checkMatch() {
        if(selectedEn && selectedTh) {
            const enEl = document.getElementById(`en-${selectedEn}`);
            const thEl = document.getElementById(`th-${selectedTh}`);
            
            if(selectedEn === selectedTh) {
                // ถูก
                enEl.classList.remove('selected');
                thEl.classList.remove('selected');
                enEl.classList.add('matched');
                thEl.classList.add('matched');
                
                totalScore++;
                roundScore++;
                document.getElementById('scoreDisplay').innerText = totalScore;
                playSound('correct');
                
                selectedEn = null;
                selectedTh = null;

                if(totalScore === MAX_SCORE) {
                    setTimeout(() => proceedToLogin(), 1000);
                } else if (roundScore === currentRoundData.length) {
                    setTimeout(() => {
                        playSound('nextRound');
                        loadRound(window.currentShuffledData);
                    }, 1000);
                }

            } else {
                // ผิด
                enEl.classList.add('wrong');
                thEl.classList.add('wrong');
                playSound('wrong');
                
                let resetEn = selectedEn;
                let resetTh = selectedTh;
                selectedEn = null;
                selectedTh = null;
                
                setTimeout(() => {
                    document.getElementById(`en-${resetEn}`).classList.remove('wrong', 'selected');
                    document.getElementById(`th-${resetTh}`).classList.remove('wrong', 'selected');
                }, 500);
            }
        }
    }

    // ================= ระบบลงชื่อ & ส่งคะแนน =================
    function proceedToLogin() {
        if(!localStorage.getItem('studentId')) {
            isSubmitting = true; 
            document.getElementById('modalSub').innerText = `คุณทำคะแนนได้ ${totalScore}/${MAX_SCORE}\nลงชื่อเพื่อบันทึกคะแนนเข้าสู่ระบบ`;
            document.getElementById('loginModal').classList.add('active');
        } else {
            submitScore();
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ สลับบัญชี?', text: "ล้างสถานะเพื่อให้นักเรียนคนใหม่เข้าเล่น", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#0284c7', cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if(res.isConfirmed) {
                localStorage.clear(); 
                document.getElementById('userProfile').style.display = 'none';
                isSubmitting = false; 
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                
                document.getElementById('modalSub').innerText = "ลงชื่อใช้งานก่อนเริ่มทำกิจกรรม";
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        let nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
    });

    function confirmUser() {
        let n = document.getElementById('in_name').value.trim();
        let r = document.getElementById('in_room').value.trim();
        let id = document.getElementById('in_id').value.trim();
        if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัส 5 หลัก', 'warning'); return; }
        
        localStorage.setItem('studentName', n); 
        localStorage.setItem('studentRoom', r); 
        localStorage.setItem('studentId', id);
        
        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id; 
        
        if (isSubmitting) submitScore();
        else initGame();
    }

    function submitScore() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = totalScore;
        const stat = document.getElementById('saveStatus');
        
        if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ ไม่พบไฟล์ตั้งค่า (quiz-config.js)"; return;
        }
        stat.innerText = "⏳ กำลังบันทึกคะแนน...";

        const payload = {
            name: localStorage.getItem('studentName'), 
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'), 
            lesson: TOPIC_NAME, score: totalScore, maxScore: MAX_SCORE
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ บันทึกคะแนนลงระบบเรียบร้อย!"; 
            playSound('success');
        }, 1500);
    }

    function restartGame() {
        document.getElementById('scoreModal').classList.remove('active');
        initGame();
        window.scrollTo(0, 0);
    }

    // Audio SFX
    function playSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'tap') {
                osc.type = "sine"; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'correct') {
                osc.type = "sine"; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.type = "sawtooth"; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'nextRound') {
                osc.type = "square"; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'success') {
                osc.type = "sine"; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        } catch(e) {}
    }
</script>

</body>
</html>
