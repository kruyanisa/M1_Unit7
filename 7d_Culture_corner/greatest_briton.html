<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz: The Greatest Briton of all</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root {
            --main-blue: #0284c7;
            --dark-blue: #1e3a8a;
            --main-red: #dc2626;
            --bg-color: #f0f9ff;
            --success: #16a34a;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 20px 10px;
            background-color: var(--bg-color);
            color: #334155;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #e0f2fe; border: 2px solid var(--main-blue);
            padding: 8px 15px; border-radius: 20px; color: var(--dark-blue); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 800px; box-sizing: border-box;
        }
        .btn-switch { background: #f43f5e; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        .header-title { font-family: 'Fredoka One', cursive; color: var(--main-red); font-size: clamp(24px, 5vw, 32px); margin: 0 0 5px 0; text-align: center; line-height: 1.2;}
        .header-subtitle { font-weight: 800; color: var(--dark-blue); margin-bottom: 20px; font-size: 16px; text-align: center; }

        .quiz-container {
            width: 100%; max-width: 800px;
            background: white; border-radius: 20px; padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.1);
            border: 3px solid #bae6fd; box-sizing: border-box;
        }

        .score-board {
            text-align: right; font-weight: 800; font-size: 18px; color: var(--main-blue); margin-bottom: 15px;
            border-bottom: 2px dashed #bae6fd; padding-bottom: 10px;
        }

        .question-text {
            font-size: 20px; font-weight: 800; color: var(--dark-blue); margin-bottom: 20px; line-height: 1.4;
        }

        .options-grid {
            display: flex; flex-direction: column; gap: 12px;
        }

        .option-btn {
            background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px;
            padding: 15px; font-family: 'Sarabun', sans-serif; font-size: 18px; font-weight: 600;
            color: #475569; text-align: left; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 0 #cbd5e1;
        }
        .option-btn:hover { background: #f1f5f9; }
        .option-btn:active { transform: translateY(4px); box-shadow: none; }

        /* Status Colors */
        .option-btn.correct { background: #dcfce7; border-color: var(--success); color: #15803d; box-shadow: 0 4px 0 #16a34a; pointer-events: none;}
        .option-btn.wrong { background: #fee2e2; border-color: var(--main-red); color: #991b1b; box-shadow: 0 4px 0 #b91c1c; pointer-events: none;}
        .option-btn.disabled { opacity: 0.6; pointer-events: none; }

        .btn-next { 
            width: 100%; margin-top: 25px; background: var(--main-blue); color: white; font-weight: 800; font-size: 18px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 var(--dark-blue); transition: 0.1s; display: none; justify-content: center; align-items: center; 
        }
        .btn-next:active { transform: translateY(4px); box-shadow: none; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240,249,255,0.9); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 30px; text-align: center; width: 100%; max-width: 340px; border: 4px solid var(--main-blue); box-shadow: 0 15px 30px rgba(2, 132, 199, 0.2); box-sizing: border-box; }
        .modal-box input.login-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid var(--main-blue); border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        
        .score-num { font-size: 60px; font-weight: 900; color: var(--main-red); margin: 10px 0; display: block; line-height: 1;}
        .btn-submit-modal { width: 100%; padding: 15px; background: var(--main-red); color: white; border: none; border-radius: 15px; font-weight: 800; font-size: 18px; cursor: pointer; box-shadow: 0 4px 0 #991b1b; transition: 0.1s; margin-top: 10px; font-family: 'Sarabun'; }
        .btn-submit-modal:active { transform: translateY(4px); box-shadow: none; }

    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 Switch Account</button>
    </div>

    <h1 class="header-title">The Greatest Briton of all</h1>
    <div class="header-subtitle">Comprehension Quiz 🧠</div>

    <div class="quiz-container">
        <div class="score-board">Score: <span id="scoreDisplay">0</span> / 6</div>
        
        <div class="question-text" id="questionText">Question goes here...</div>
        
        <div class="options-grid" id="optionsContainer">
            <!-- Options created by JS -->
        </div>

        <button class="btn-next" id="btnNext" onclick="nextQuestion()">Next Question ➡</button>
        <button class="btn-next" id="btnFinish" style="background: var(--main-red); box-shadow: 0 4px 0 #991b1b;" onclick="proceedToLogin()">🚀 Submit Score</button>
    </div>

    <!-- Modal Login -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-blue); margin-top:0; font-size: 24px;">📝 Sign In</h2>
            <p id="modalSub" style="color: #64748b; font-weight: 600; margin-top: 0; font-size: 14px;">Please enter your details to save your score.</p>
            <input type="text" id="in_name" class="login-input" placeholder="First Name - Last Name">
            <input type="text" id="in_room" class="login-input" placeholder="Class/Room (e.g., 1/1)">
            <input type="text" id="in_id" class="login-input" placeholder="Student ID (5 digits)" maxlength="5">
            <button class="btn-submit-modal" onclick="confirmUser()">🚀 Save Score</button>
        </div>
    </div>

    <!-- Modal Score/Success -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-blue); margin-top:0; font-size: 26px;">🎉 Excellent!</h2>
            <p style="color: #64748b; font-weight: 600; margin-bottom: 0;">Your final score is</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:30px; color:#fca5a5;">/6</span></span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d; min-height:22px;"></div>
            <button class="btn-submit-modal" style="background: var(--main-blue); box-shadow: 0 4px 0 var(--dark-blue);" onclick="restartGame()">🔄 Try Again</button>
        </div>
    </div>

<script>
    const TOPIC_NAME = 'M.1 Unit 7 The Greatest Briton Quiz';
    
    const quizData = [
        {
            q: "1. Who was the founder of the world-wide Scout Movement?",
            options: ["Robert Baden Powell", "Winston Churchill", "Stephen Hawking", "David Attenborough"],
            ans: 0
        },
        {
            q: "2. Which person was the longest reigning monarch in the world?",
            options: ["Princess Diana", "Queen Elizabeth II", "Alcmene", "Queen Victoria"],
            ans: 1
        },
        {
            q: "3. Who is the mother of the future king of England?",
            options: ["Princess Diana", "Queen Elizabeth II", "Queen Elizabeth I", "Princess Anne"],
            ans: 0
        },
        {
            q: "4. Who was a scientist from Oxford that used a special computer to talk?",
            options: ["David Attenborough", "Robert Baden Powell", "Stephen Hawking", "Winston Churchill"],
            ans: 2
        },
        {
            q: "5. Who was one of the Prime Ministers of England during the 20th century?",
            options: ["David Attenborough", "Stephen Hawking", "Robert Baden Powell", "Winston Churchill"],
            ans: 3
        },
        {
            q: "6. Who is a TV presenter most famous for his documentaries like 'Blue Planet'?",
            options: ["David Attenborough", "Stephen Hawking", "Winston Churchill", "Robert Baden Powell"],
            ans: 0
        }
    ];

    const MAX_SCORE = quizData.length;
    let currentQuestionIndex = 0;
    let score = 0;
    let isSubmitting = false;

    document.addEventListener("DOMContentLoaded", () => {
        loadQuestion();
        if(localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }
    });

    function loadQuestion() {
        const qData = quizData[currentQuestionIndex];
        document.getElementById('questionText').innerText = qData.q;
        document.getElementById('scoreDisplay').innerText = score;
        
        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        
        document.getElementById('btnNext').style.display = 'none';
        document.getElementById('btnFinish').style.display = 'none';

        qData.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btnElement) {
        const correctIndex = quizData[currentQuestionIndex].ans;
        const allButtons = document.querySelectorAll('.option-btn');
        
        allButtons.forEach(btn => btn.classList.add('disabled'));

        if (selectedIndex === correctIndex) {
            btnElement.classList.add('correct');
            score++;
            document.getElementById('scoreDisplay').innerText = score;
            playSound('correct');
        } else {
            btnElement.classList.add('wrong');
            allButtons[correctIndex].classList.remove('disabled');
            allButtons[correctIndex].classList.add('correct');
            playSound('wrong');
        }

        if (currentQuestionIndex < MAX_SCORE - 1) {
            document.getElementById('btnNext').style.display = 'flex';
        } else {
            document.getElementById('btnFinish').style.display = 'flex';
        }
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    function proceedToLogin() {
        if(!localStorage.getItem('studentId')) {
            isSubmitting = true; 
            document.getElementById('modalSub').innerText = `Your score is ${score}/${MAX_SCORE}\nPlease sign in to save it.`;
            document.getElementById('loginModal').classList.add('active');
        } else {
            submitScore();
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ Switch Account?', 
            text: "Are you sure you want to change the user? Current progress will be lost.", 
            icon: 'warning',
            showCancelButton: true, 
            confirmButtonColor: '#0284c7', 
            cancelButtonColor: '#94a3b8',
            confirmButtonText: 'Yes, switch account', 
            cancelButtonText: 'Cancel'
        }).then((res) => {
            if(res.isConfirmed) {
                localStorage.clear(); 
                document.getElementById('userProfile').style.display = 'none';
                
                isSubmitting = false; 
                
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                
                document.getElementById('modalSub').innerText = "Please sign in to start the quiz.";
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        let nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `M.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `M.1/${nums[0]}`;
    });

    function confirmUser() {
        let n = document.getElementById('in_name').value.trim();
        let r = document.getElementById('in_room').value.trim();
        let id = document.getElementById('in_id').value.trim();
        if(!n || !r || id.length !== 5) { Swal.fire('Incomplete Details!', 'Please enter Name, Room, and a 5-digit Student ID.', 'warning'); return; }
        
        localStorage.setItem('studentName', n); 
        localStorage.setItem('studentRoom', r); 
        localStorage.setItem('studentId', id);
        
        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id; 
        
        if (isSubmitting) {
            submitScore();
        } else {
            restartGame(); 
        }
    }

    function submitScore() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = score;
        const stat = document.getElementById('saveStatus');
        
        if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ Configuration file not found (quiz-config.js)"; 
            return;
        }

        stat.innerText = "⏳ Saving score...";

        const payload = {
            name: localStorage.getItem('studentName'), 
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'), 
            lesson: TOPIC_NAME, score: score, maxScore: MAX_SCORE
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ Score saved successfully!"; 
            playSound('success');
        }, 1500);
    }

    function restartGame() {
        document.getElementById('scoreModal').classList.remove('active');
        currentQuestionIndex = 0;
        score = 0;
        loadQuestion();
    }

    // Web Audio API for Sound Effects
    function playSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = "sine";
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'success') {
                osc.type = "sine";
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        } catch(e) {}
    }
</script>

</body>
</html>
