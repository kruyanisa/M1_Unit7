<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>It was great! - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root {
            --main-teal: #0ea5e9; 
            --dark-teal: #0369a1;
            --main-orange: #f59e0b;
            --bg-color: #f0f9ff;
            --success: #16a34a;
            --error: #dc2626;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 20px 10px;
            background-color: var(--bg-color);
            color: #334155;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #e0f2fe; border: 2px solid var(--main-teal);
            padding: 8px 15px; border-radius: 20px; color: var(--dark-teal); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; width: 100%; max-width: 800px; box-sizing: border-box;
        }
        .btn-switch { background: #f43f5e; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        .header-title { font-family: 'Fredoka One', cursive; color: var(--main-teal); font-size: clamp(26px, 5vw, 34px); margin: 0 0 5px 0; text-align: center; line-height: 1.2;}
        .header-subtitle { font-weight: 800; color: var(--main-orange); margin-bottom: 15px; font-size: 16px; text-align: center; }

        .game-container {
            width: 100%; max-width: 600px;
            background: white; border-radius: 20px; padding: 20px 15px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.15);
            border: 3px solid #bae6fd; box-sizing: border-box;
            margin-bottom: 20px;
        }

        .round-info {
            text-align: center; font-weight: 800; font-size: 16px; color: #64748b;
            margin-bottom: 15px; display: flex; justify-content: space-between;
            border-bottom: 2px dashed #bae6fd; padding-bottom: 10px;
        }

        .img-container {
            width: 100%; display: flex; justify-content: center; margin-bottom: 15px;
        }
        .place-img {
            width: 100%; max-width: 400px; border-radius: 15px; border: 3px solid #e0f2fe;
            aspect-ratio: 16/9; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Sentence Builder */
        .sentence-box {
            background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px;
            padding: 15px; text-align: center; font-size: 18px; font-weight: 800;
            color: #1e293b; margin-bottom: 20px; line-height: 1.8;
            font-family: 'Fredoka One', cursive;
        }
        .slot {
            display: inline-block; min-width: 100px; border-bottom: 3px solid #cbd5e1;
            padding: 0 10px; color: #94a3b8; font-family: 'Sarabun'; font-weight: 600; font-size: 16px;
        }
        .slot.filled { border-bottom-color: var(--main-teal); color: var(--dark-teal); font-family: 'Fredoka One', cursive; font-size: 18px;}

        /* Options Area */
        .options-section { display: flex; flex-direction: column; gap: 15px; }
        @media(min-width: 500px) {
            .options-section { flex-direction: row; }
            .option-group { flex: 1; }
        }

        .option-group {
            background: #f0f9ff; border-radius: 12px; padding: 10px; border: 1px solid #bae6fd;
        }
        .group-title { font-weight: 800; color: var(--dark-teal); margin-bottom: 10px; font-size: 15px; text-align: center; }

        .btn-choice {
            display: block; width: 100%; text-align: center; padding: 10px;
            margin-bottom: 8px; background: white; border: 2px solid #cbd5e1;
            border-radius: 10px; font-family: 'Sarabun', sans-serif; font-size: 15px;
            font-weight: 600; color: #475569; cursor: pointer; transition: 0.1s; box-sizing: border-box;
        }
        .btn-choice:active { transform: translateY(2px); }
        .btn-choice.selected { background: var(--main-teal); color: white; border-color: var(--dark-teal); box-shadow: 0 3px 0 var(--dark-teal); }
        .btn-choice.disabled { pointer-events: none; opacity: 0.6; }
        
        /* Highlight Results */
        .btn-choice.correct-ans { background: #dcfce7 !important; border-color: #166534 !important; color: #166534 !important; box-shadow: none !important;}
        .btn-choice.wrong-ans { background: #fee2e2 !important; border-color: #b91c1c !important; color: #b91c1c !important; box-shadow: none !important;}

        .btn-action { 
            width: 100%; max-width: 400px; margin: 20px auto 0 auto; background: var(--main-orange); color: white; font-weight: 800; font-size: 18px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #b45309; transition: 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; 
        }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }
        .btn-action.disabled { opacity: 0.5; pointer-events: none; background: #cbd5e1; box-shadow: 0 4px 0 #94a3b8; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240,249,255,0.9); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 3000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 30px; text-align: center; width: 100%; max-width: 340px; border: 4px solid var(--main-teal); box-shadow: 0 15px 30px rgba(14, 165, 233, 0.2); box-sizing: border-box; }
        .modal-box input.login-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid var(--main-teal); border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        .score-num { font-size: 60px; font-weight: 900; color: var(--main-orange); margin: 10px 0; display: block; line-height: 1;}
        .btn-submit-modal { width: 100%; padding: 15px; background: var(--main-teal); color: white; border: none; border-radius: 15px; font-weight: 800; font-size: 18px; cursor: pointer; box-shadow: 0 4px 0 var(--dark-teal); transition: 0.1s; margin-top: 10px; font-family: 'Sarabun'; }
        .btn-submit-modal:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับบัญชี</button>
    </div>

    <h1 class="header-title">My Weekend Portfolio</h1>
    <div class="header-subtitle">Match the places and activities! 📸</div>

    <!-- ไฟล์เสียง SFX แบบ MP3 ของคุณครู -->
    <audio id="audioCorrect" src="correct.mp3"></audio>
    <audio id="audioWrong" src="wrong.mp3"></audio>

    <div class="game-container">
        <div class="round-info">
            <span>Score: <span id="scoreDisplay" style="color:var(--success);">0</span>/10</span>
            <span>Image: <span id="roundDisplay">1</span>/5</span>
        </div>
        
        <div class="img-container">
            <img id="mainImage" src="" alt="Place" class="place-img">
        </div>

        <div class="sentence-box">
            I went to <span class="slot" id="slotPlace">the ...</span><br>
            and <span class="slot" id="slotAction">did ...</span>.
        </div>

        <div class="options-section">
            <div class="option-group">
                <div class="group-title">📍 Select Place</div>
                <div id="placeOptions"></div>
            </div>
            <div class="option-group">
                <div class="group-title">🏃 Select Action (V.2)</div>
                <div id="actionOptions"></div>
            </div>
        </div>

        <button class="btn-action disabled" id="btnCheck" onclick="checkAnswer()">🔍 ตรวจคำตอบ</button>
    </div>

    <!-- Modal Login -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-teal); margin-top:0; font-size: 24px;">📝 ลงชื่อรับคะแนน</h2>
            <p id="modalSub" style="color: #64748b; font-weight: 600; margin-top: 0; font-size: 14px;"></p>
            <input type="text" id="in_name" class="login-input" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" class="login-input" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" class="login-input" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-submit-modal" onclick="confirmUser()">🚀 ยืนยัน</button>
        </div>
    </div>

    <!-- Modal Score -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-teal); margin-top:0; font-size: 26px;">🎉 เรียบร้อย!</h2>
            <p style="color: #64748b; font-weight: 600; margin-bottom: 0;">คะแนนของคุณคือ</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:30px; color:#fcd34d;">/10</span></span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d; min-height:22px;"></div>
            <button class="btn-submit-modal" style="background: var(--main-orange); box-shadow: 0 4px 0 #b45309;" onclick="restartGame()">🔄 ลองเล่นใหม่อีกครั้ง</button>
        </div>
    </div>

<script>
    const TOPIC_NAME = 'ม.1 Unit 7 It was great Portfolio';
    
    const allData = [
        { id: 1, image: "zoo.jpg", place: "the zoo", action: "saw wild animals" },
        { id: 2, image: "concert_hall.jpg", place: "a concert hall", action: "listened to a guitar concert" },
        { id: 3, image: "art_gallery.jpg", place: "an art gallery", action: "saw paintings by John Nush" },
        { id: 4, image: "adventure_park.jpg", place: "an adventure park", action: "went on a rollercoaster" },
        { id: 5, image: "cinema.jpg", place: "the cinema", action: "saw Jumanji" }
    ];

    const MAX_SCORE = 10; // 5 ข้อ x 2 คะแนน
    let currentDataList = [];
    let currentRound = 0;
    let score = 0;
    let selectedPlace = null;
    let selectedAction = null;
    let isSubmitting = false;

    // สำหรับเสียงปุ่มกดทั่วไป (ไม่ต้องใช้ไฟล์)
    let audioCtx = null;

    document.addEventListener("DOMContentLoaded", () => {
        initGame();
        if(localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }
    });

    function initGame() {
        score = 0;
        currentRound = 0;
        document.getElementById('scoreDisplay').innerText = score;
        currentDataList = [...allData].sort(() => Math.random() - 0.5);
        loadRound();
    }

    function loadRound() {
        if (currentRound >= 5) {
            proceedToLogin();
            return;
        }

        selectedPlace = null;
        selectedAction = null;
        
        const currentItem = currentDataList[currentRound];
        document.getElementById('roundDisplay').innerText = currentRound + 1;
        document.getElementById('mainImage').src = currentItem.image;
        
        const sPlace = document.getElementById('slotPlace');
        const sAction = document.getElementById('slotAction');
        sPlace.innerText = "the ..."; sPlace.className = "slot";
        sAction.innerText = "did ..."; sAction.className = "slot";
        
        document.getElementById('btnCheck').classList.add('disabled');
        document.getElementById('btnCheck').innerText = "🔍 ตรวจคำตอบ";

        const allPlaces = allData.map(d => d.place);
        const placeChoices = generateChoices(currentItem.place, allPlaces);
        const placeContainer = document.getElementById('placeOptions');
        placeContainer.innerHTML = '';
        placeChoices.forEach((c, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.id = `btn-p-${idx}`;
            btn.innerText = c;
            btn.onclick = () => pickPlace(c, `btn-p-${idx}`);
            placeContainer.appendChild(btn);
        });

        const allActions = allData.map(d => d.action);
        const actionChoices = generateChoices(currentItem.action, allActions);
        const actionContainer = document.getElementById('actionOptions');
        actionContainer.innerHTML = '';
        actionChoices.forEach((c, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.id = `btn-a-${idx}`;
            btn.innerText = c;
            btn.onclick = () => pickAction(c, `btn-a-${idx}`);
            actionContainer.appendChild(btn);
        });
    }

    function generateChoices(correctAnswer, allOptionsPool) {
        let choices = [correctAnswer];
        let distractors = allOptionsPool.filter(opt => opt !== correctAnswer);
        distractors.sort(() => Math.random() - 0.5);
        choices.push(distractors[0]);
        choices.push(distractors[1]);
        return choices.sort(() => Math.random() - 0.5);
    }

    function pickPlace(text, btnId) {
        playSound('tap');
        selectedPlace = text;
        const sPlace = document.getElementById('slotPlace');
        sPlace.innerText = text;
        sPlace.classList.add('filled');

        document.getElementById('placeOptions').querySelectorAll('.btn-choice').forEach(b => b.classList.remove('selected'));
        document.getElementById(btnId).classList.add('selected');
        
        checkReady();
    }

    function pickAction(text, btnId) {
        playSound('tap');
        selectedAction = text;
        const sAction = document.getElementById('slotAction');
        sAction.innerText = text;
        sAction.classList.add('filled');

        document.getElementById('actionOptions').querySelectorAll('.btn-choice').forEach(b => b.classList.remove('selected'));
        document.getElementById(btnId).classList.add('selected');

        checkReady();
    }

    function checkReady() {
        if (selectedPlace && selectedAction) {
            document.getElementById('btnCheck').classList.remove('disabled');
        }
    }

    function checkAnswer() {
        const currentItem = currentDataList[currentRound];
        const isPlaceCorrect = (selectedPlace === currentItem.place);
        const isActionCorrect = (selectedAction === currentItem.action);

        // คำนวณคะแนนข้อนี้
        let pointsEarned = 0;
        if (isPlaceCorrect) pointsEarned++;
        if (isActionCorrect) pointsEarned++;

        score += pointsEarned;
        document.getElementById('scoreDisplay').innerText = score;

        // ล็อกปุ่ม
        document.querySelectorAll('.btn-choice').forEach(b => b.classList.add('disabled'));
        document.getElementById('btnCheck').classList.add('disabled');

        // ไฮไลท์ฝั่งสถานที่
        const placeBtns = document.getElementById('placeOptions').querySelectorAll('.btn-choice');
        placeBtns.forEach(btn => {
            if (btn.innerText === currentItem.place) btn.classList.add('correct-ans'); 
            if (btn.classList.contains('selected') && !isPlaceCorrect) btn.classList.add('wrong-ans'); 
        });

        // ไฮไลท์ฝั่งกิจกรรม
        const actionBtns = document.getElementById('actionOptions').querySelectorAll('.btn-choice');
        actionBtns.forEach(btn => {
            if (btn.innerText === currentItem.action) btn.classList.add('correct-ans');
            if (btn.classList.contains('selected') && !isActionCorrect) btn.classList.add('wrong-ans');
        });

        // แจ้งผลลัพธ์และเล่นเสียง MP3
        if (pointsEarned === 2) {
            document.getElementById('audioCorrect').play().catch(e=>{});
            document.getElementById('btnCheck').innerText = "✅ ยอดเยี่ยม! (+2 คะแนน)";
        } else if (pointsEarned === 1) {
            document.getElementById('audioWrong').play().catch(e=>{});
            document.getElementById('btnCheck').innerText = "⚠️ เกือบถูก! (+1 คะแนน) ดูเฉลยสีเขียวนะ";
        } else {
            document.getElementById('audioWrong').play().catch(e=>{});
            document.getElementById('btnCheck').innerText = "❌ ผิดจ้า ดูเฉลยสีเขียวนะ";
        }

        setTimeout(() => {
            currentRound++;
            loadRound();
        }, 3000); // ให้เวลาดูเฉลย 3 วินาที
    }

    // ================= ระบบลงชื่อ & ส่งคะแนน =================
    function proceedToLogin() {
        if(!localStorage.getItem('studentId')) {
            isSubmitting = true; 
            document.getElementById('modalSub').innerText = `คุณทำได้ ${score}/${MAX_SCORE} คะแนน\nลงชื่อเพื่อบันทึกคะแนนเข้าสู่ระบบ`;
            document.getElementById('loginModal').classList.add('active');
        } else {
            submitScore();
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ สลับบัญชี?', text: "ล้างสถานะเพื่อให้นักเรียนคนใหม่เข้าเล่น", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#0ea5e9', cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if(res.isConfirmed) {
                localStorage.clear(); 
                document.getElementById('userProfile').style.display = 'none';
                isSubmitting = false; 
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                
                document.getElementById('modalSub').innerText = "ลงชื่อใช้งานก่อนเริ่มทำกิจกรรม";
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        let nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
    });

    function confirmUser() {
        let n = document.getElementById('in_name').value.trim();
        let r = document.getElementById('in_room').value.trim();
        let id = document.getElementById('in_id').value.trim();
        if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัส 5 หลัก', 'warning'); return; }
        
        localStorage.setItem('studentName', n); 
        localStorage.setItem('studentRoom', r); 
        localStorage.setItem('studentId', id);
        
        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id; 
        
        if (isSubmitting) submitScore();
        else initGame();
    }

    function submitScore() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = score;
        const stat = document.getElementById('saveStatus');
        
        if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ ไม่พบไฟล์ตั้งค่า (quiz-config.js)"; return;
        }
        stat.innerText = "⏳ กำลังบันทึกคะแนน...";

        const payload = {
            name: localStorage.getItem('studentName'), 
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'), 
            lesson: TOPIC_NAME, score: score, maxScore: MAX_SCORE
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ บันทึกคะแนนลงระบบเรียบร้อย!"; 
            playSound('success'); // ใช้เสียงจบบทเรียน
        }, 1500);
    }

    function restartGame() {
        document.getElementById('scoreModal').classList.remove('active');
        initGame();
        window.scrollTo(0, 0);
    }

    // เสียงปุ่มกดทั่วไป (ไม่ต้องดึงจากไฟล์)
    function playSound(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const gain = audioCtx.createGain();
            const osc = audioCtx.createOscillator();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'tap') {
                osc.type = "sine"; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'success') {
                osc.type = "sine"; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        } catch(e) {}
    }
</script>

</body>
</html>
