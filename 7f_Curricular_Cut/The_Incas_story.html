<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Incas - Listen & Read</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Prompt:wght@500;700&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>

    <style>
        :root {
            --bg-sand: #efe6d5;
            --paper-bg: #fbf7ef;
            --inca-brown: #4a2c18;
            --inca-gold: #d97706;
            --inca-gold-dark: #b45309;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 16px 12px 40px 12px;
            background-color: var(--bg-sand);
            background-image: radial-gradient(rgba(180, 83, 9, 0.08) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--inca-brown);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Profile Bar */
        .profile-bar {
            font-size: clamp(12px, 3.3vw, 14px);
            background: #fef3c7;
            border: 2px solid var(--inca-gold);
            padding: 8px 14px;
            border-radius: 20px;
            color: var(--inca-brown);
            font-weight: 700;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            width: 100%;
            max-width: 760px;
        }

        .btn-switch {
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            font-weight: 700;
            font-size: 13px;
        }

        /* Header */
        .header-wrap {
            text-align: center;
            margin-bottom: 16px;
            width: 100%;
            max-width: 760px;
        }

        .badge-unit {
            display: inline-block;
            background: var(--inca-gold);
            color: #fff;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 6px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--inca-brown);
            font-size: clamp(26px, 6vw, 38px);
            margin: 0;
            line-height: 1.15;
        }

        .subtitle-hint {
            font-size: 14px;
            color: #78350f;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Main Cards */
        .card {
            width: 100%;
            max-width: 760px;
            background: var(--paper-bg);
            border: 3px solid #e7d3b3;
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 10px 25px rgba(74, 44, 24, 0.12);
            margin-bottom: 18px;
        }

        /* Video Section */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1c1917;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Word-by-Word Subtitle Overlay on Video */
        .video-sub-overlay {
            position: absolute;
            left: 50%;
            bottom: 46px;
            transform: translateX(-50%);
            width: 94%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .video-sub-box {
            display: inline-block;
            background: rgba(20, 15, 10, 0.84);
            color: #f5f5f4;
            font-family: 'Prompt', sans-serif;
            font-size: clamp(13px, 3vw, 19px);
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 10px;
            line-height: 1.45;
            text-shadow: 0 1px 2px #000;
        }

        .video-sub-overlay.hidden,
        .video-sub-box:empty {
            display: none;
        }

        .sub-word {
            display: inline-block;
            padding: 0 3px;
            margin: 0 1px;
            border-radius: 5px;
            transition: background-color 0.08s, color 0.08s;
        }

        .sub-word.active {
            background-color: #fde047;
            color: #451a03;
            font-weight: 700;
            text-shadow: none;
        }

        .sub-word.is-vocab {
            pointer-events: auto;
            cursor: pointer;
            border-bottom: 2px dashed #f87171;
            color: #fca5a5;
        }

        .sub-word.is-vocab.active {
            color: #991b1b;
        }

        .video-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-cc {
            background: var(--inca-brown);
            color: #fef3c7;
            border: none;
            padding: 7px 14px;
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cc.off {
            background: #a8a29e;
            color: #fff;
        }

        /* Compact Key Vocabulary Bar */
        .vocab-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 2px dashed #e7d3b3;
        }

        .vocab-label {
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--inca-gold-dark);
            margin-bottom: 8px;
        }

        .vocab-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .vocab-chip {
            background: #fff;
            border: 2px dashed #ef4444;
            color: #b91c1c;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.15s;
        }

        .vocab-chip:hover {
            background: #fee2e2;
            transform: translateY(-1px);
        }

        /* Vocab Popover */
        #vocab-popover {
            display: none;
            position: absolute;
            background: #ffffff;
            border: 2px solid var(--inca-brown);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
            padding: 12px 16px;
            border-radius: 12px;
            text-align: center;
            z-index: 1000;
            min-width: 170px;
            max-width: 240px;
        }

        .pop-eng { font-family: 'Prompt', sans-serif; font-size: 18px; font-weight: 700; color: var(--inca-brown); text-transform: capitalize; }
        .pop-pos { font-size: 12px; color: #92400e; font-weight: 700; background: #fef3c7; display: inline-block; padding: 1px 8px; border-radius: 8px; margin: 3px 0; }
        .pop-phonetic { color: #78716c; font-size: 13px; margin-bottom: 6px; }
        .pop-thai { color: #0369a1; font-weight: 800; font-size: 17px; }

        /* Quiz Section */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #d6bc96;
            padding-bottom: 10px;
            margin-bottom: 16px;
        }

        .quiz-title {
            font-family: 'Prompt', sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: var(--inca-brown);
            margin: 0;
        }

        .quiz-badge {
            background: #dcfce7;
            color: #15803d;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            border: 2px solid #86efac;
        }

        .question-card {
            background: #ffffff;
            border: 2px solid #e7d3b3;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .question-text {
            font-family: 'Prompt', sans-serif;
            font-size: clamp(15px, 4vw, 17px);
            font-weight: 700;
            color: var(--inca-brown);
            margin: 0 0 10px 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        @media (min-width: 600px) {
            .options-grid { grid-template-columns: 1fr 1fr; }
        }

        .option-btn {
            text-align: left;
            background: #fafaf9;
            border: 2px solid #d6d3d1;
            border-radius: 12px;
            padding: 10px 12px;
            font-family: 'Sarabun', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #292524;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .option-btn:hover:not(:disabled) { border-color: var(--inca-gold); background: #fffbeb; }
        .option-btn.selected { border-color: var(--inca-gold); background: #fef3c7; color: var(--inca-brown); font-weight: 800; }
        .option-btn.correct { border-color: var(--success); background: #dcfce7; color: #14532d; font-weight: 800; }
        .option-btn.wrong { border-color: var(--danger); background: #fee2e2; color: #7f1d1d; font-weight: 800; }

        .opt-letter {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e7e5e4;
            color: #44403c;
            font-family: 'Prompt', sans-serif;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .option-btn.selected .opt-letter { background: var(--inca-gold); color: #fff; }
        .option-btn.correct .opt-letter { background: var(--success); color: #fff; }
        .option-btn.wrong .opt-letter { background: var(--danger); color: #fff; }

        .btn-submit {
            width: 100%;
            max-width: 380px;
            margin: 16px auto 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--inca-gold);
            color: #fff;
            font-family: 'Prompt', sans-serif;
            font-size: 18px;
            font-weight: 700;
            padding: 13px 20px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--inca-gold-dark);
        }

        .btn-submit:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--inca-gold-dark); }
        .btn-submit:disabled { background: #a8a29e; box-shadow: 0 5px 0 #78716c; cursor: not-allowed; }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(74, 44, 24, 0.72);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            visibility: hidden;
            opacity: 0;
            transition: 0.25s;
            padding: 15px;
        }

        .modal-overlay.active { visibility: visible; opacity: 1; }

        .modal-box {
            background: #fff;
            padding: 26px 22px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 350px;
            border: 4px solid var(--inca-gold);
        }

        .login-input {
            width: 100%;
            padding: 11px;
            margin-bottom: 10px;
            border: 2px solid var(--inca-gold);
            border-radius: 12px;
            text-align: center;
            font-family: 'Sarabun', sans-serif;
            font-size: 16px;
            font-weight: 600;
            outline: none;
        }

        .score-num {
            font-family: 'Fredoka One', cursive;
            font-size: 60px;
            color: var(--inca-gold-dark);
            margin: 8px 0;
            display: block;
            line-height: 1;
        }

        .btn-modal {
            width: 100%;
            padding: 12px;
            background: var(--inca-gold);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: 'Prompt', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--inca-gold-dark);
            margin-top: 8px;
        }

        .btn-retry { background: #16a34a; box-shadow: 0 4px 0 #15803d; }
        .video-wrapper:fullscreen { border-radius: 0; }
        .video-wrapper:fullscreen .video-sub-box { font-size: clamp(18px, 3.2vw, 28px); }
    </style>
</head>
<body>

    <!-- User Profile Bar -->
    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">Switch Account</button>
    </div>

    <!-- Header -->
    <div class="header-wrap">
        <div class="badge-unit">Unit 7 • Curricular Cut</div>
        <h1>The Incas (1197AD–1572AD)</h1>
        <div class="subtitle-hint">Watch the video, tap key vocabulary for meanings, and answer 5 questions.</div>
    </div>

    <!-- Video + Key Vocabulary Card -->
    <div class="card">
        <div class="video-wrapper" id="videoWrapper">
    <video id="story-video" controls playsinline preload="metadata" controlsList="nofullscreen">
        <source src="The_Incas.mp4" type="video/mp4">
    </video>
    <div id="videoSubOverlay" class="video-sub-overlay">
        <div id="videoSubBox" class="video-sub-box"></div>
    </div>
</div>

<div class="video-toolbar">
    <div style="display:flex; gap:8px;">
        <button id="btnToggleCC" class="btn-cc" onclick="toggleCC()">CC Subtitle: ON</button>
        <button class="btn-cc" style="background:#b45309;" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>
    <span style="font-size:13px; color:#78350f; font-weight:600;">💡 Tap red words for Thai meanings</span>
</div>

        <!-- Compact Key Vocabulary Bar -->
        <div class="vocab-section">
            <div class="vocab-label">📚 Key Vocabulary (Tap to see meaning):</div>
            <div class="vocab-chips" id="vocabChips"></div>
        </div>
    </div>

    <!-- Quiz Card -->
    <div class="card" id="quizSection">
        <div class="quiz-header">
            <h2 class="quiz-title">📝 Reading Comprehension</h2>
            <span class="quiz-badge">5 Points</span>
        </div>
        <div id="quizContainer"></div>
        <button id="btnCheckQuiz" class="btn-submit" onclick="checkAndSubmitQuiz()">✅ Check Answers & Submit Score</button>
    </div>

    <!-- Vocabulary Popover -->
    <div id="vocab-popover">
        <div class="pop-eng" id="pop-eng"></div>
        <div class="pop-pos" id="pop-pos"></div>
        <div class="pop-phonetic" id="pop-phonetic"></div>
        <div class="pop-thai" id="pop-thai"></div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 style="color:var(--inca-brown); margin:0 0 6px 0; font-family:'Prompt';">📝 Student Login</h2>
            <p id="modalSub" style="color:#78716c; font-weight:600; margin:0 0 12px 0; font-size:14px;"></p>
            <input type="text" id="in_name" class="login-input" placeholder="Full Name (ชื่อ - นามสกุล)">
            <input type="text" id="in_room" class="login-input" placeholder="Class / Room (เช่น 1/1)">
            <input type="text" id="in_id" class="login-input" placeholder="Student ID (รหัสนักเรียน 5 หลัก)" maxlength="5">
            <button class="btn-modal" onclick="confirmUser()">🚀 Confirm & Save Score</button>
        </div>
    </div>

    <!-- Score Modal -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--inca-brown); margin:0; font-family:'Prompt';">🎉 Great Job!</h2>
            <p style="color:#78716c; font-weight:600; margin:6px 0 0 0;">Your Score</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:30px; color:#d97706;">/5</span></span>
            <div id="saveStatus" style="font-weight:700; font-size:15px; margin-bottom:12px; color:#15803d; min-height:22px;"></div>
            <button class="btn-modal btn-retry" onclick="closeScoreModal()">👀 Review Answers</button>
            <button class="btn-modal" style="background:#f59e0b; box-shadow:0 4px 0 #b45309;" onclick="resetQuiz()">🔄 Try Quiz Again</button>
        </div>
    </div>

        { start: 53.150, end: 55.500, words: [{w:"Their",s:53.150,e:53.330},{w:"temples",s:53.410,e:53.931},{w:"were",s:54.051,e:54.211},{w:"very",s:54.311,e:54.591},{w:"beautiful.",s:54.652,e:55.152}] },
        { start: 56.153, end: 57.200, words: [{w:"Transport.",s:56.153,e:56.874}] },
        { start: 57.595, end: 60.350, words: [{w:"The",s:57.595,e:57.715},{w:"Incas",s:57.875,e:58.296},{w:"had",s:58.376,e:58.536},{w:"a",s:58.556,e:58.596},{w:"great",s:58.696,e:58.956},{w:"system",s:59.096,e:59.477},{w:"of",s:59.517,e:59.597},{w:"roads.",s:59.697,e:60.138}] },
        { start: 60.678, end: 65.200, words: [{w:"They",s:60.678,e:60.838},{w:"used",s:60.999,e:61.219},{w:"animals",s:61.419,e:61.840},{w:"to",s:61.960,e:62.080},{w:"transport",s:62.160,e:62.801},{w:"food",s:62.901,e:63.261},{w:"across",s:63.461,e:63.882},{w:"the",s:63.962,e:64.062},{w:"empire.",s:64.182,e:64.703}] }
    ];

    const quizData = [
        { q: "1. Where did the emperors live?", options: ["In a palace.", "In small villages.", "In stone temples.", "In the fields."], answer: "In a palace." },
        { q: "2. Where did the people live?", options: ["In small villages and stone houses.", "In a palace in Cuzco.", "In wooden houses with big doors.", "Inside the beautiful temples."], answer: "In small villages and stone houses." },
        { q: "3. Where did the people work?", options: ["In the fields growing corn, potatoes, beans and peppers.", "In the palace helping the Sapa Inca.", "On the rivers catching fish and ducks.", "In the markets selling stone pots."], answer: "In the fields growing corn, potatoes, beans and peppers." },
        { q: "4. What were their temples like?", options: ["They were very beautiful.", "They were very small and dark.", "They were made of wood.", "They had big golden doors."], answer: "They were very beautiful." },
        { q: "5. How did the Incas travel?", options: ["They had a great system of roads and used animals to transport food.", "They used big wooden boats across the ocean.", "They rode horses on mountain paths.", "They walked without using any animals."], answer: "They had a great system of roads and used animals to transport food." }
    ];

    const video = document.getElementById("story-video");
    const subOverlay = document.getElementById("videoSubOverlay");
    const subBox = document.getElementById("videoSubBox");
    const popover = document.getElementById("vocab-popover");

    let ccEnabled = true;
    let currentSegIdx = -1;
    let currentWordIdx = -1;
    let userAnswers = {};
    let currentQuizOrder = [];
    let isQuizGraded = false;
    let latestScore = 0;
    let isPendingSubmit = false;
    let audioCtx = null;

    document.addEventListener("DOMContentLoaded", () => {
        renderVocabChips();
        renderQuiz();
        loadStudentProfile();
    });

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSFX(type) {
        initAudio();
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'tap') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(520, now);
                gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                osc.start(now); osc.stop(now + 0.06);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc.start(now); osc.stop(now + 0.45);
            }
        } catch (e) {}
    }

    // สร้างปุ่มคำศัพท์ 6 คำใต้วิดีโอ
    function renderVocabChips() {
        const wrap = document.getElementById("vocabChips");
        wrap.innerHTML = "";
        Object.keys(dictionary).forEach(key => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "vocab-chip";
            btn.innerText = dictionary[key].label;
            btn.onclick = (e) => {
                e.stopPropagation();
                playSFX('tap');
                showPopover(e, key);
            };
            wrap.appendChild(btn);
        });
    }

    // ซิงก์ซับบนวิดีโอแบบไฮไลท์ทีละคำ (60 FPS)
    function syncVideoSubtitle() {
        if (!ccEnabled) return;

        const time = video.currentTime + SYNC_OFFSET;
        const segIdx = subtitleSegments.findIndex(seg => time >= seg.start && time <= seg.end);

        if (segIdx !== currentSegIdx) {
            currentSegIdx = segIdx;
            currentWordIdx = -1;
            subBox.innerHTML = "";

            if (segIdx !== -1) {
                subtitleSegments[segIdx].words.forEach((item, wIdx) => {
                    const span = document.createElement("span");
                    span.className = "sub-word";
                    span.id = `sw-${wIdx}`;
                    span.innerText = item.w;

                    const clean = item.w.replace(/[^a-zA-Z]/g, "").toLowerCase();
                    if (dictionary[clean]) {
                        span.classList.add("is-vocab");
                        span.onclick = (e) => {
                            e.stopPropagation();
                            video.pause();
                            playSFX('tap');
                            showPopover(e, clean);
                        };
                    }
                    subBox.appendChild(span);
                });
            }
        }

        if (segIdx !== -1) {
            const words = subtitleSegments[segIdx].words;
            const wIdx = words.findIndex((item, i) => {
                const next = words[i + 1];
                const endT = next ? next.s : item.e + 0.4;
                return time >= item.s && time < endT;
            });

            if (wIdx !== currentWordIdx) {
                if (currentWordIdx !== -1) {
                    const oldW = document.getElementById(`sw-${currentWordIdx}`);
                    if (oldW) oldW.classList.remove("active");
                }
                if (wIdx !== -1) {
                    const newW = document.getElementById(`sw-${wIdx}`);
                    if (newW) newW.classList.add("active");
                }
                currentWordIdx = wIdx;
            }
        }

        if (!video.paused && !video.ended) {
            requestAnimationFrame(syncVideoSubtitle);
        }
    }

    video.addEventListener("play", () => requestAnimationFrame(syncVideoSubtitle));
    video.addEventListener("seeked", () => syncVideoSubtitle());
    video.addEventListener("ended", () => { currentSegIdx = -1; currentWordIdx = -1; subBox.innerHTML = ""; });

    function toggleFullscreen() {
    const wrapper = document.getElementById("videoWrapper");
    if (!document.fullscreenElement) {
        if (wrapper.requestFullscreen) wrapper.requestFullscreen();
        else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
    }
    function toggleCC() {
        ccEnabled = !ccEnabled;
        const btn = document.getElementById("btnToggleCC");
        if (ccEnabled) {
            btn.innerText = "CC Subtitle: ON";
            btn.classList.remove("off");
            subOverlay.classList.remove("hidden");
            syncVideoSubtitle();
        } else {
            btn.innerText = "CC Subtitle: OFF";
            btn.classList.add("off");
            subOverlay.classList.add("hidden");
            subBox.innerHTML = "";
        }
    }

    function showPopover(event, wordKey) {
        const container = document.fullscreenElement || document.webkitFullscreenElement || document.body;
        if (popover.parentNode !== container) container.appendChild(popover);
        const data = dictionary[wordKey];
        document.getElementById("pop-eng").innerText = data.label;
        document.getElementById("pop-pos").innerText = data.pos;
        document.getElementById("pop-phonetic").innerText = data.phonetic;
        document.getElementById("pop-thai").innerText = data.thai;

        popover.style.position = "fixed";
    popover.style.display = "block";
    const popW = popover.offsetWidth;
    const popH = popover.offsetHeight;
    let leftPos = event.clientX - (popW / 2);
    let topPos = event.clientY + 18;

    if (leftPos < 10) leftPos = 10;
    if (leftPos + popW > window.innerWidth - 10) leftPos = window.innerWidth - popW - 10;
    if (topPos + popH > window.innerHeight - 10) topPos = event.clientY - popH - 18;

    popover.style.left = leftPos + "px";
    popover.style.top = topPos + "px";
    }

    document.addEventListener("click", () => { popover.style.display = "none"; });

    // ================= ระบบแบบทดสอบปรนัย 5 ข้อ =================
    function renderQuiz() {
        const container = document.getElementById("quizContainer");
        container.innerHTML = "";
        userAnswers = {};
        isQuizGraded = false;
        const btn = document.getElementById("btnCheckQuiz");
        btn.innerText = "✅ Check Answers & Submit Score";
        btn.style.background = "";        // กลับเป็นสีทองเดิม
        btn.onclick = checkAndSubmitQuiz; // กลับไปเป็นปุ่มตรวจคำตอบ

        currentQuizOrder = quizData.map(item => ({
            q: item.q,
            answer: item.answer,
            options: [...item.options].sort(() => Math.random() - 0.5)
        }));

        const letters = ["A", "B", "C", "D"];
        currentQuizOrder.forEach((item, qIdx) => {
            const qCard = document.createElement("div");
            qCard.className = "question-card";
            qCard.innerHTML = `<p class="question-text">${item.q}</p>`;

            const grid = document.createElement("div");
            grid.className = "options-grid";

            item.options.forEach((optText, oIdx) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "option-btn";
                btn.id = `q-${qIdx}-opt-${oIdx}`;
                btn.innerHTML = `<span class="opt-letter">${letters[oIdx]}</span><span>${optText}</span>`;
                btn.onclick = () => selectOption(qIdx, oIdx, optText);
                grid.appendChild(btn);
            });

            qCard.appendChild(grid);
            container.appendChild(qCard);
        });
    }

    function selectOption(qIdx, oIdx, optText) {
        if (isQuizGraded) return;
        playSFX('tap');
        userAnswers[qIdx] = { oIdx, text: optText };
        for (let i = 0; i < 4; i++) {
            const btn = document.getElementById(`q-${qIdx}-opt-${i}`);
            if (btn) btn.classList.toggle("selected", i === oIdx);
        }
    }

    function checkAndSubmitQuiz() {
        if (Object.keys(userAnswers).length < currentQuizOrder.length) {
            Swal.fire({ icon: 'warning', title: 'Incomplete Quiz', text: 'Please answer all 5 questions!', confirmButtonColor: '#d97706' });
            return;
        }

        isQuizGraded = true;
        const btn = document.getElementById("btnCheckQuiz");
        btn.innerText = "🔄 Try Quiz Again";
        btn.style.background = "#16a34a"; // เปลี่ยนเป็นสีเขียว
        btn.onclick = resetQuiz;          // กดแล้วเริ่มทำใหม่เลย
        let score = 0;

        currentQuizOrder.forEach((item, qIdx) => {
            const chosen = userAnswers[qIdx];
            item.options.forEach((optText, oIdx) => {
                const btn = document.getElementById(`q-${qIdx}-opt-${oIdx}`);
                btn.disabled = true;
                btn.classList.remove("selected");
                if (optText === item.answer) btn.classList.add("correct");
                if (oIdx === chosen.oIdx && optText !== item.answer) btn.classList.add("wrong");
            });
            if (chosen.text === item.answer) score++;
        });

        latestScore = score;
        playSFX('success');

        if (!localStorage.getItem('studentId')) {
            isPendingSubmit = true;
            document.getElementById('modalSub').innerText = `You scored ${latestScore}/5! Enter your details to save your score.`;
            document.getElementById('loginModal').classList.add('active');
        } else {
            submitScoreToSheet();
        }
    }

    // ================= บัญชีนักเรียน & ส่งคะแนน Google Sheets =================
    function loadStudentProfile() {
        if (localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId');
        }
    }

    document.getElementById('in_room').addEventListener('blur', function () {
        const nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
    });

    function switchAccount() {
        Swal.fire({
            title: 'Switch Account?', text: 'Clear current student info?', icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#d97706', cancelButtonColor: '#78716c',
            confirmButtonText: 'Yes, switch', cancelButtonText: 'Cancel'
        }).then((res) => {
            if (res.isConfirmed) {
                localStorage.clear();
                document.getElementById('userProfile').style.display = 'none';
                isPendingSubmit = false;
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                document.getElementById('modalSub').innerText = 'Enter student details to begin.';
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    function confirmUser() {
        const n = document.getElementById('in_name').value.trim();
        const r = document.getElementById('in_room').value.trim();
        const id = document.getElementById('in_id').value.trim();
        if (!n || !r || id.length !== 5) {
            Swal.fire('Incomplete Info', 'Please enter name, room, and 5-digit student ID.', 'warning');
            return;
        }
        localStorage.setItem('studentName', n);
        localStorage.setItem('studentRoom', r);
        localStorage.setItem('studentId', id);
        document.getElementById('loginModal').classList.remove('active');
        loadStudentProfile();
        if (isPendingSubmit) { isPendingSubmit = false; submitScoreToSheet(); }
    }

    function submitScoreToSheet() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = latestScore;
        const stat = document.getElementById('saveStatus');

        if (typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ Config file (quiz-config.js) not found.";
            return;
        }

        stat.innerText = "⏳ Saving your score...";
        fetch(QUIZ_CONFIG.SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            body: JSON.stringify({
                name: localStorage.getItem('studentName'),
                room: localStorage.getItem('studentRoom'),
                studentId: "'" + localStorage.getItem('studentId'),
                lesson: TOPIC_NAME,
                score: latestScore,
                maxScore: 5
            })
        }).catch(e => console.error(e));

        setTimeout(() => { stat.innerText = "✅ Score saved successfully!"; }, 1200);
    }

    function closeScoreModal() { document.getElementById('scoreModal').classList.remove('active'); }
    function resetQuiz() {
        document.getElementById('scoreModal').classList.remove('active');
        renderQuiz();
        document.getElementById('quizSection').scrollIntoView({ behavior: 'smooth' });
    }
</script>
