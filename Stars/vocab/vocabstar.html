<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocabulary Matching - Unit 7 Stars</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root {
            --main-theme: #0ea5e9; 
            --dark-theme: #0284c7;
            --bg-color: #f0f9ff;
            --accent-theme: #f59e0b; 
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 15px 10px;
            background-color: var(--bg-color);
            color: #334155;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #e0f2fe; border: 2px solid var(--main-theme);
            padding: 8px 15px; border-radius: 20px; color: var(--dark-theme); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; width: 100%; max-width: 800px;
        }
        .btn-switch { background: #f43f5e; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        .game-container {
            width: 100%; max-width: 800px;
            background: white; border-radius: 20px;
            padding: 20px; box-sizing: border-box;
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.15);
            border: 3px solid #bae6fd;
            margin-bottom: 30px;
        }

        .header-title { font-family: 'Fredoka One', cursive; color: var(--main-theme); font-size: 26px; margin: 0 0 5px 0; text-align: center; }
        .sub-title { font-weight: 800; color: #0284c7; margin-bottom: 15px; font-size: 16px; text-align: center; }
        
        .score-board {
            background: var(--main-theme); color: white; padding: 10px 20px; border-radius: 15px;
            font-family: 'Fredoka One', cursive; font-size: 20px; text-align: center; margin-bottom: 10px;
            box-shadow: 0 4px 0 var(--dark-theme);
        }
        
        .round-indicator {
            text-align: center; font-weight: 800; color: #94a3b8; font-size: 14px; margin-bottom: 15px;
        }

        .instruction-text { font-weight: 800; color: var(--accent-theme); margin-bottom: 15px; text-align: center; font-size: 15px;}

        /* Match Grid */
        .match-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-bottom: 20px;
        }

        .item-btn {
            background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 15px;
            padding: 12px 10px; font-family: 'Sarabun', sans-serif; font-size: 16px;
            color: #475569; text-align: center; cursor: pointer; font-weight: 600;
            transition: all 0.2s; box-shadow: 0 4px 0 #cbd5e1;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
            min-height: 70px;
        }
        
        .item-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .item-btn.selected {
            background: #e0f2fe; border-color: var(--main-theme); color: var(--dark-theme);
            box-shadow: 0 4px 0 var(--dark-theme); transform: scale(1.05);
        }
        
        .item-btn.matched {
            visibility: hidden; opacity: 0; transition: visibility 0.3s, opacity 0.3s;
        }

        .item-btn.wrong-shake {
            animation: shake 0.4s; background: #fee2e2; border-color: #ef4444; color: #991b1b;
        }

        .sound-icon {
            font-size: 20px; background: #e2e8f0; border-radius: 50%; width: 35px; height: 35px;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #cbd5e1; color: #64748b;
        }
        .item-btn.selected .sound-icon { background: #bae6fd; border-color: var(--main-theme); color: var(--dark-theme); }

        @keyframes shake {
            0% { transform: translateX(0); } 25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); } 75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Modal UI */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240,249,255,0.9); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 30px; text-align: center; width: 100%; max-width: 340px; border: 4px solid var(--main-theme); box-shadow: 0 15px 30px rgba(14, 165, 233, 0.2); box-sizing: border-box; }
        .modal-box input.login-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid var(--main-theme); border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        .modal-box input.login-input:focus { border-color: var(--dark-theme); }
        .score-num { font-size: 60px; font-weight: 900; color: var(--dark-theme); margin: 10px 0; display: block; line-height: 1;}
        
        .btn-action { width: 100%; padding: 15px; background: var(--main-theme); color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; font-family: 'Sarabun'; box-shadow: 0 6px 0 var(--dark-theme); transition: 0.1s; font-size: 20px; margin-top: 10px;}
        .btn-action:active { transform: translateY(6px); box-shadow: none; }
    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับบัญชี</button>
    </div>

    <div class="game-container">
        <h1 class="header-title">Vocabulary Match 🧩</h1>
        <div class="sub-title">Stars: Biography and Careers</div>
        
        <div class="score-board">
            Score: <span id="scoreDisplay">0</span> / <span id="maxScoreDisplay">19</span>
        </div>
        
        <!-- ตัวบอกด่านย่อย -->
        <div class="round-indicator" id="roundDisplay">Set 1 of 4</div>
        
        <div class="instruction-text">👆 จิ้มคำศัพท์ภาษาอังกฤษ แล้วจิ้มคำแปลภาษาไทยที่ตรงกัน</div>

        <div class="match-grid" id="matchContainer">
            <!-- สร้างด้วย JS -->
        </div>

    </div>

    <!-- Modal Login -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="color:var(--dark-theme); margin-top:0; font-size: 24px;">📝 ลงชื่อส่งคำตอบ</h2>
            <p id="modalSub" style="color: #64748b; font-weight: 600; margin-top: 0; display:none; font-size: 14px;"></p>
            <input type="text" id="in_name" class="login-input" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" class="login-input" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" class="login-input" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-action" id="btnSubmitLogin" onclick="confirmUser()" style="margin-top:5px; margin-bottom: 0;">🚀 บันทึกคะแนน</button>
        </div>
    </div>

    <!-- Modal Score -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-theme); margin-top:0; font-size: 26px;">🎉 เก่งมาก!</h2>
            <p style="color: #64748b; font-weight: 600; margin-bottom: 0;">คะแนนของคุณคือ</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:30px; color:#bae6fd;">/19</span></span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d; min-height:22px;"></div>
            <button id="playAgainBtn" class="btn-action" onclick="resetGame()" style="display:none; margin-top:5px; margin-bottom: 0;">🔄 เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

<script>
    const TOPIC_NAME = 'ม.1 Unit 7 Vocabulary Match';
    const ITEMS_PER_ROUND = 5; // แสดงทีละ 5 คำ
    let MAX_SCORE = 19; // คำศัพท์ทั้งหมด 19 คำ
    let score = 0;
    
    let isSwitchingAccount = false;
    let currentAudio = null;
    
    let currentRound = 0;
    let totalRounds = 0;
    let shuffledFullDeck = []; // เก็บคำศัพท์ที่สุ่มลำดับแล้วทั้ง 19 คำ
    let wordsMatchedInRound = 0; // นับคำที่จับคู่ถูกในรอบนั้นๆ

    const allVocab = [
        { en: "become", th: "กลายเป็น, ได้มาเป็น", audio: "become.mp3" },
        { en: "career", th: "อาชีพ, เส้นทางอาชีพ", audio: "career.mp3" },
        { en: "end", th: "สิ้นสุด, จบลง", audio: "end.mp3" },
        { en: "film (v.)", th: "ถ่ายทำภาพยนตร์", audio: "film.mp3" },
        { en: "land", th: "ได้รับ (บทบาท)", audio: "land.mp3" },
        { en: "member", th: "สมาชิก", audio: "member.mp3" },
        { en: "perform", th: "แสดง", audio: "perform.mp3" },
        { en: "retire", th: "อำลาวงการ, เกษียณ", audio: "retire.mp3" },
        { en: "sign", th: "เซ็นสัญญา", audio: "sign.mp3" },
        { en: "star", th: "แสดงนำ, รับบทนำ", audio: "star.mp3" },
        { en: "want", th: "ต้องการ, อยากจะ", audio: "want.mp3" },
        { en: "audition", th: "การคัดเลือกนักแสดง", audio: "audition.mp3" },
        { en: "child", th: "เด็ก", audio: "child.mp3" },
        { en: "film (n.)", th: "ภาพยนตร์", audio: "film.mp3" },
        { en: "football player", th: "นักฟุตบอล", audio: "football_player.mp3" },
        { en: "group", th: "กลุ่ม, วงดนตรี", audio: "group.mp3" },
        { en: "acting", th: "เกี่ยวกับการแสดง", audio: "acting.mp3" },
        { en: "married", th: "แต่งงานแล้ว", audio: "married.mp3" },
        { en: "tall", th: "สูง", audio: "tall.mp3" }
    ];

    let selectedEnglish = null;
    let selectedThai = null;

    document.addEventListener("DOMContentLoaded", () => {
        if(localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }
        document.getElementById('maxScoreDisplay').innerText = MAX_SCORE;
        startGame();
    });

    function startGame() {
        score = 0;
        currentRound = 0;
        document.getElementById('scoreDisplay').innerText = score;
        
        // สับเปลี่ยนคำศัพท์ทั้งหมด 19 คำตั้งแต่เริ่มเกม
        shuffledFullDeck = [...allVocab].sort(() => Math.random() - 0.5);
        totalRounds = Math.ceil(shuffledFullDeck.length / ITEMS_PER_ROUND);
        
        loadRound();
    }

    function loadRound() {
        const container = document.getElementById('matchContainer');
        container.innerHTML = '';
        selectedEnglish = null;
        selectedThai = null;
        wordsMatchedInRound = 0;

        document.getElementById('roundDisplay').innerText = `Set ${currentRound + 1} of ${totalRounds}`;

        // ตัดคำศัพท์มา 5 คำตามรอบ (ถ้าด่านสุดท้ายจะเหลือ 4 คำ)
        const startIndex = currentRound * ITEMS_PER_ROUND;
        const roundData = shuffledFullDeck.slice(startIndex, startIndex + ITEMS_PER_ROUND);
        const roundItemCount = roundData.length;
        
        let enList = [];
        let thList = [];

        roundData.forEach(item => {
            enList.push({ text: item.en, matchId: item.en, type: 'en', audio: item.audio });
            thList.push({ text: item.th, matchId: item.en, type: 'th' });
        });

        enList.sort(() => Math.random() - 0.5);
        thList.sort(() => Math.random() - 0.5);

        for (let i = 0; i < roundItemCount; i++) {
            const enBtn = document.createElement('div');
            enBtn.className = 'item-btn';
            enBtn.setAttribute('data-id', enList[i].matchId);
            enBtn.setAttribute('data-type', 'en');
            enBtn.innerHTML = `<div class="sound-icon" onclick="event.stopPropagation(); playAudio('${enList[i].audio}')">🔊</div><span>${enList[i].text}</span>`;
            enBtn.onclick = () => handleSelect(enBtn, roundItemCount);
            container.appendChild(enBtn);

            const thBtn = document.createElement('div');
            thBtn.className = 'item-btn';
            thBtn.setAttribute('data-id', thList[i].matchId);
            thBtn.setAttribute('data-type', 'th');
            thBtn.innerText = thList[i].text;
            thBtn.onclick = () => handleSelect(thBtn, roundItemCount);
            container.appendChild(thBtn);
        }
    }

    function playAudio(filename) {
        if(currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
        currentAudio = new Audio(filename);
        currentAudio.play().catch(e => console.log('Audio error:', e));
    }

    function handleSelect(btn, roundItemCount) {
        if(btn.classList.contains('matched')) return;

        const type = btn.getAttribute('data-type');
        
        if (type === 'en') {
            if (selectedEnglish) selectedEnglish.classList.remove('selected');
            if (selectedEnglish !== btn) {
                selectedEnglish = btn;
                selectedEnglish.classList.add('selected');
            } else {
                selectedEnglish = null;
            }
        } else {
            if (selectedThai) selectedThai.classList.remove('selected');
            if (selectedThai !== btn) {
                selectedThai = btn;
                selectedThai.classList.add('selected');
            } else {
                selectedThai = null;
            }
        }

        playSound(700, "sine", 0.05);
        checkMatch(roundItemCount);
    }

    function checkMatch(roundItemCount) {
        if (selectedEnglish && selectedThai) {
            const idEn = selectedEnglish.getAttribute('data-id');
            const idTh = selectedThai.getAttribute('data-id');

            if (idEn === idTh) {
                score++;
                wordsMatchedInRound++;
                document.getElementById('scoreDisplay').innerText = score;
                playSound(800, "sine", 0.15);
                
                selectedEnglish.classList.add('matched');
                selectedThai.classList.add('matched');
                
                selectedEnglish.classList.remove('selected');
                selectedThai.classList.remove('selected');
                
                selectedEnglish = null;
                selectedThai = null;

                // ตรวจสอบว่าจบรอบหรือจบเกม
                if (wordsMatchedInRound === roundItemCount) {
                    currentRound++;
                    if (currentRound < totalRounds) {
                        // โหลดด่านถัดไป
                        setTimeout(() => { loadRound(); }, 800);
                    } else {
                        // จบเกมครบ 19 คำ
                        setTimeout(() => { showLoginModal(); }, 800);
                    }
                }
            } else {
                playSound(150, "sawtooth", 0.3);
                selectedEnglish.classList.add('wrong-shake');
                selectedThai.classList.add('wrong-shake');
                
                let tempEn = selectedEnglish;
                let tempTh = selectedThai;
                
                selectedEnglish.classList.remove('selected');
                selectedThai.classList.remove('selected');
                selectedEnglish = null;
                selectedThai = null;

                setTimeout(() => {
                    tempEn.classList.remove('wrong-shake');
                    tempTh.classList.remove('wrong-shake');
                }, 400);
            }
        }
    }

    function resetGame() {
        if(currentAudio) { currentAudio.pause(); }
        document.getElementById('scoreModal').classList.remove('active');
        document.getElementById('loginModal').classList.remove('active');
        startGame(); // เริ่มสุ่ม 19 คำใหม่ทั้งหมด
    }

    function showLoginModal() {
        if(!localStorage.getItem('studentId')) {
            document.getElementById('modalTitle').innerText = "📝 ลงชื่อส่งคำตอบ";
            document.getElementById('modalSub').innerText = `คะแนนของคุณคือ ${score}/${MAX_SCORE}\nลงชื่อเพื่อบันทึกคะแนน`;
            document.getElementById('modalSub').style.display = 'block';
            document.getElementById('btnSubmitLogin').innerText = "🚀 บันทึกคะแนน";
            document.getElementById('loginModal').classList.add('active');
        } else { 
            submitScore(); 
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ เปลี่ยนคนเล่น?', text: "เริ่มเกมใหม่สำหรับบัญชีอื่น", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#0ea5e9', cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if(res.isConfirmed) {
                localStorage.clear(); 
                document.getElementById('userProfile').style.display = 'none';
                isSwitchingAccount = true;
                
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                
                document.getElementById('modalTitle').innerText = "🔄 ลงชื่อบัญชีใหม่";
                document.getElementById('modalSub').innerText = "กรุณาลงชื่อนักเรียนคนใหม่ก่อนเริ่มเกมครับ";
                document.getElementById('modalSub').style.display = 'block';
                document.getElementById('btnSubmitLogin').innerText = "🚀 เริ่มเล่นเกม";
                
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        let nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
    });

    function confirmUser() {
        let n = document.getElementById('in_name').value.trim();
        let r = document.getElementById('in_room').value.trim();
        let id = document.getElementById('in_id').value.trim();
        if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัส 5 หลัก', 'warning'); return; }
        
        localStorage.setItem('studentName', n); 
        localStorage.setItem('studentRoom', r); 
        localStorage.setItem('studentId', id);
        
        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id; 
        
        if (isSwitchingAccount) {
            isSwitchingAccount = false;
            resetGame();
        } else {
            submitScore();
        }
    }

    function submitScore() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = score;
        const stat = document.getElementById('saveStatus');
        const playAgainBtn = document.getElementById('playAgainBtn');

        if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ ไม่พบไฟล์ตั้งค่า (quiz-config.js)"; 
            playAgainBtn.style.display = 'block'; return;
        }

        stat.innerText = "⏳ กำลังส่งคะแนน...";
        playAgainBtn.style.display = 'none';

        const payload = {
            name: localStorage.getItem('studentName'), 
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'), 
            lesson: TOPIC_NAME, score: score, maxScore: MAX_SCORE
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ บันทึกคะแนนลงระบบเรียบร้อย!"; 
            playAgainBtn.style.display = 'block';
        }, 1500);
    }

    function playSound(freq, type, duration) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }
</script>
</body>
</html>
