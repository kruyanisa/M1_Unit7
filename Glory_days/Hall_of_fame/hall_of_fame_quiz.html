<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hall of Fame - Flash Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- เชื่อมต่อระบบบันทึกคะแนน -->
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>

    <style>
        :root {
            --main-theme: #ea580c; /* สีส้มเข้ม สไตล์ประวัติศาสตร์ */
            --dark-theme: #9a3412; 
            --bg-color: #fff7ed;
            --accent-theme: #fdba74;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 10px;
            background-color: var(--bg-color);
            color: #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Profile Bar */
        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #ffedd5; border: 2px solid var(--accent-theme);
            padding: 8px 15px; border-radius: 20px; color: var(--dark-theme); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; width: 100%; max-width: 600px;
        }
        .btn-switch { background: #fca5a5; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        /* Game Container */
        .game-container {
            width: 100%; max-width: 600px;
            background: white; border-radius: 24px;
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.15);
            padding: 20px; box-sizing: border-box;
            text-align: center;
        }

        .header-title { font-family: 'Fredoka One', cursive; color: var(--main-theme); margin: 0 0 5px 0; font-size: 28px;}
        .progress-text { font-weight: 800; color: #64748b; margin-bottom: 15px; font-size: 16px; }

        /* ส่วนแสดงรูปภาพบุคคล */
        .person-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .image-frame {
            width: 160px;
            height: 160px;
            border-radius: 50%; /* กรอบรูปวงกลมเหมือนในหนังสือ */
            border: 6px solid #fed7aa;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .person-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* แสดงภาพครบโดยรักษาสัดส่วนเดิม */
        }

        .person-name { font-weight: 800; font-size: 20px; color: #1e293b; line-height: 1.2; }
        .person-years { font-weight: 600; font-size: 14px; color: #64748b; }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 12px;
            width: 100%;
        }

        .option-btn {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 15px 10px;
            font-family: 'Fredoka One', 'Sarabun', sans-serif;
            font-size: 18px;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #cbd5e1;
        }
        .option-btn:hover { border-color: var(--main-theme); color: var(--main-theme); transform: translateY(-2px); box-shadow: 0 6px 0 var(--main-theme); }
        .option-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--main-theme); }
        .option-btn.disabled { pointer-events: none; }
        
        /* สถานะถูก/ผิด (แสดงสีตามเดิม) */
        .correct-ans { background-color: #22c55e !important; border-color: #166534 !important; color: white !important; box-shadow: 0 4px 0 #166534 !important; transform: translateY(0); }
        .wrong-ans { background-color: #ef4444 !important; border-color: #991b1b !important; color: white !important; box-shadow: 0 4px 0 #991b1b !important; animation: shake 0.4s; }

        @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* Modal UI */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,247,237,0.9); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 30px; text-align: center; width: 100%; max-width: 340px; border: 4px solid var(--main-theme); box-shadow: 0 15px 30px rgba(154, 52, 18, 0.2); box-sizing: border-box; }
        .modal-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid var(--main-theme); border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        .modal-box input:focus { border-color: var(--dark-theme); }
        .btn-action { width: 100%; padding: 14px; background: var(--main-theme); color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; font-family: 'Sarabun'; box-shadow: 0 5px 0 var(--dark-theme); transition: 0.1s; font-size: 18px; }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }
        .score-num { font-size: 60px; font-weight: 900; color: var(--dark-theme); margin: 10px 0; display: block; line-height: 1;}

    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับ</button>
    </div>

    <div class="game-container">
        <h1 class="header-title">Hall of Fame</h1>
        <div class="progress-text" id="progressText">Question 1 / 8</div>

        <div class="person-box">
            <div class="image-frame">
                <img id="personImage" class="person-img" src="" alt="Person Image" onerror="this.src='https://via.placeholder.com/160?text=?'">
            </div>
            <div class="person-name" id="personName">Name</div>
            <div class="person-years" id="personYears">(0000 - 0000)</div>
        </div>

        <div class="options-grid" id="optionsContainer">
            <!-- ปุ่มตัวเลือกจะถูกสร้างตรงนี้ -->
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="color:var(--dark-theme); margin-top:0; font-size: 24px;">📝 ลงชื่อเข้าเรียน</h2>
            <p id="modalSub" style="color: #64748b; font-weight: 600; margin-top: 0; display:none; font-size: 14px;"></p>
            <input type="text" id="in_name" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-action" onclick="confirmUser()">🚀 เริ่มทำควิซ</button>
        </div>
    </div>

    <!-- Modal สรุปคะแนน -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-theme); margin-top:0; font-size: 26px;">🎉 ทำได้ยอดเยี่ยม!</h2>
            <p style="color: #64748b; font-weight: 600; margin-bottom: 0;">คะแนนของคุณคือ</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:30px; color:#94a3b8;">/8</span></span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d; min-height:22px;"></div>
            <button id="playAgainBtn" class="btn-action" onclick="restartGame()" style="display:none;">🔄 เล่นอีกครั้ง</button>
        </div>
    </div>

<script>
    // ข้อมูลตัวละคร
    const hallOfFameData = [
        { name: "Jesse Owens", years: "(1913-1980)", job: "an athlete", img: "Jesse_Owens.jpg" },
        { name: "Yuri Gagarin", years: "(1934-1968)", job: "an astronaut", img: "Yuri_Gagarin.jpg" },
        { name: "El Greco", years: "(1541-1614)", job: "a painter", img: "El_Greco.jpg" },
        { name: "Florence Nightingale", years: "(1820-1910)", job: "a nurse", img: "Florence_Nightingale.jpg" },
        { name: "Anna Pavlova", years: "(1881-1931)", job: "a ballerina", img: "Anna_Pavlova.jpg" },
        { name: "A. Fleming", years: "(1881-1955)", job: "a doctor", img: "Alexander_Fleming.jpg" },
        { name: "Marco Polo", years: "(1254-1324)", job: "an explorer", img: "Marco_Polo.jpg" },
        { name: "Albert Einstein", years: "(1879-1955)", job: "a scientist", img: "Albert_Einstein.jpg" }
    ];

    // รายการอาชีพทั้งหมดสำหรับใช้เป็นตัวเลือกหลอก
    const allJobs = ["an athlete", "an astronaut", "a painter", "a nurse", "a ballerina", "a scientist", "an explorer", "a doctor"];

    const TOPIC_NAME = 'ม.1 Unit 7 Hall of fame Vocab jobs';
    const MAX_Q = hallOfFameData.length;
    let score = 0;
    let currentQ = 0;
    let shuffledQuestions = [];
    let isSwitchingAccount = false;
    let canClick = true;

    window.onload = () => { checkLoginStatus(); };

    function initGame() {
        score = 0;
        currentQ = 0;
        shuffledQuestions = [...hallOfFameData].sort(() => Math.random() - 0.5);
        loadQuestion();
    }

    function loadQuestion() {
        canClick = true;
        document.getElementById('progressText').innerText = `Question ${currentQ + 1} / ${MAX_Q}`;
        
        const currentData = shuffledQuestions[currentQ];
        
        // แอนิเมชันรูปภาพและข้อมูล
        const imgEl = document.getElementById('personImage');
        imgEl.style.animation = 'none';
        imgEl.offsetHeight; // รีเซ็ตแอนิเมชัน
        imgEl.style.animation = 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        
        imgEl.src = currentData.img;
        document.getElementById('personName').innerText = currentData.name;
        document.getElementById('personYears').innerText = currentData.years;

        // สร้างตัวเลือก (ถูก 1 ข้อ, ผิด 3 ข้อ)
        let wrongOptions = allJobs.filter(job => job !== currentData.job);
        wrongOptions = wrongOptions.sort(() => Math.random() - 0.5).slice(0, 3);
        
        let options = [currentData.job, ...wrongOptions];
        options = options.sort(() => Math.random() - 0.5);

        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';

        options.forEach(optText => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerText = optText;
            btn.onclick = () => checkAnswer(optText === currentData.job, btn, currentData.job);
            container.appendChild(btn);
        });
    }

    // เสียงตอบถูกและตอบผิด (สร้างเสียงในเบราว์เซอร์ ไม่ต้องใช้ไฟล์เสียง)
    function playAnswerSound(isCorrect) {
        try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;
            const context = new AudioContextClass();
            if (context.state === 'suspended') context.resume();

            const notes = isCorrect
                ? [{ frequency: 523.25, start: 0, duration: 0.13 }, { frequency: 783.99, start: 0.15, duration: 0.23 }]
                : [{ frequency: 330, start: 0, duration: 0.16 }, { frequency: 220, start: 0.18, duration: 0.25 }];

            notes.forEach(note => {
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                const startTime = context.currentTime + note.start;
                const endTime = startTime + note.duration;
                oscillator.type = isCorrect ? 'sine' : 'triangle';
                oscillator.frequency.setValueAtTime(note.frequency, startTime);
                gain.gain.setValueAtTime(0.0001, startTime);
                gain.gain.exponentialRampToValueAtTime(0.18, startTime + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0001, endTime);
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.start(startTime);
                oscillator.stop(endTime);
            });
            setTimeout(() => context.close().catch(() => {}), 1000);
        } catch (error) {
            console.warn('ไม่สามารถเล่นเสียงได้:', error);
        }
    }

    function checkAnswer(isCorrect, selectedBtn, correctText) {
        if (!canClick) return;
        canClick = false; 

        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.classList.add('disabled'));

        playAnswerSound(isCorrect);

        if (isCorrect) {
            score++;
            selectedBtn.classList.add('correct-ans');
            selectedBtn.innerText = "✔️ " + selectedBtn.innerText;
        } else {
            selectedBtn.classList.add('wrong-ans');
            selectedBtn.innerText = "❌ " + selectedBtn.innerText;
            
            // ไฮไลท์ข้อที่ถูกให้เด็กดู
            allBtns.forEach(btn => {
                if(btn.innerText === correctText) {
                    btn.classList.add('correct-ans');
                }
            });
        }

        setTimeout(() => {
            currentQ++;
            if (currentQ < MAX_Q) {
                loadQuestion();
            } else {
                endGame();
            }
        }, 1200); // ดีเลย์เดิม
    }

    function endGame() {
        if(!localStorage.getItem('studentId')) {
            document.getElementById('modalTitle').innerText = "👋 จบเกมแล้ว!";
            document.getElementById('modalSub').innerText = `คุณได้ ${score}/${MAX_Q} คะแนน กรอกข้อมูลเพื่อบันทึก`;
            document.getElementById('modalSub').style.display = 'block';
            document.getElementById('loginModal').classList.add('active');
        } else { 
            submitScore(); 
        }
    }

    function checkLoginStatus() {
        if(localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
            if(shuffledQuestions.length === 0) initGame();
        } else {
            document.getElementById('userProfile').style.display = 'none';
            document.getElementById('loginModal').classList.add('active');
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ เปลี่ยนคนเล่น?', text: "ข้อมูลเดิมจะถูกสลับออกนะ", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#ea580c', cancelButtonColor: '#9ca3af',
            confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if(res.isConfirmed) {
                localStorage.clear(); isSwitchingAccount = true;
                document.getElementById('in_name').value = ''; 
                document.getElementById('in_room').value = ''; 
                document.getElementById('in_id').value = '';
                document.getElementById('modalTitle').innerText = "🔄 ลงชื่อบัญชีใหม่";
                document.getElementById('modalSub').style.display = 'none';
                checkLoginStatus(); 
            }
        });
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        let nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
    });

    function confirmUser() {
        let n = document.getElementById('in_name').value.trim();
        let r = document.getElementById('in_room').value.trim();
        let id = document.getElementById('in_id').value.trim();
        if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัส 5 หลัก', 'warning'); return; }
        
        localStorage.setItem('studentName', n); 
        localStorage.setItem('studentRoom', r); 
        localStorage.setItem('studentId', id);
        
        document.getElementById('loginModal').classList.remove('active'); 
        
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id;

        if (isSwitchingAccount) { 
            isSwitchingAccount = false;
            initGame(); 
        } else if (currentQ >= MAX_Q) { 
            submitScore(); 
        } else {
            initGame();
        }
    }

    function submitScore() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = score;
        const stat = document.getElementById('saveStatus');
        const playAgainBtn = document.getElementById('playAgainBtn');

        if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ ไม่พบไฟล์ตั้งค่า (quiz-config.js)"; 
            playAgainBtn.style.display = 'block'; return;
        }

        stat.innerText = "⏳ กำลังส่งคะแนน...";
        stat.style.color = "var(--dark-theme)";
        playAgainBtn.style.display = 'none';

        const payload = {
            name: localStorage.getItem('studentName'), 
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'), 
            lesson: TOPIC_NAME, 
            score: score, 
            maxScore: MAX_Q
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ บันทึกคะแนนลงระบบเรียบร้อย!"; 
            stat.style.color = "#15803d";
            playAgainBtn.style.display = 'block';
        }, 1500);
    }

    function restartGame() {
        document.getElementById('scoreModal').classList.remove('active');
        initGame();
    }
</script>
</body>
</html>
