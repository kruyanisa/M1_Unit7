<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speaking Quiz - Hall of Fame</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>

    <style>
        :root {
            --main-theme: #0ea5e9; 
            --dark-theme: #0369a1; 
            --bg-color: #f0f9ff;
            --accent-theme: #7dd3fc;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 10px;
            background-color: var(--bg-color);
            color: #334155;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #e0f2fe; border: 2px solid var(--accent-theme);
            padding: 8px 15px; border-radius: 20px; color: var(--dark-theme); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; width: 100%; max-width: 600px;
        }
        .btn-switch { background: #fca5a5; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        .game-container {
            width: 100%; max-width: 600px;
            background: white; border-radius: 24px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.15);
            padding: 20px; box-sizing: border-box;
            text-align: center;
        }

        .header-title { font-family: 'Fredoka One', cursive; color: var(--main-theme); margin: 0 0 5px 0; font-size: 28px;}
        .progress-text { font-weight: 800; color: #64748b; margin-bottom: 15px; font-size: 16px; }

        /* การปรับปรุงที่ 1: แก้ไขกรอบรูปไม่ให้ล้น และแยกโซนรูปกับชื่อให้ชัดเจน */
        .person-display {
            background: #f8fafc;
            border: 3px dashed #bae6fd;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .large-image-frame {
            width: 100%;
            height: 200px; /* ล็อกความสูงรูปไว้ที่ 200px จะได้ไม่ล้น */
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            border-radius: 12px;
            overflow: hidden;
        }

        .large-image-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* ให้รูปยืดหดพอดีกรอบอัตโนมัติ */
        }

        .person-name { font-weight: 800; font-size: 24px; color: #0f172a; margin: 0; z-index: 10;}
        .person-years { font-weight: 600; font-size: 16px; color: #64748b; margin: 0; z-index: 10;}

        /* Chat UI */
        .chat-box {
            display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;
        }
        .chat-bubble {
            max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 16px; font-weight: 600;
            line-height: 1.4; opacity: 0.4; transition: 0.3s; position: relative;
        }
        .chat-bubble.active { opacity: 1; transform: scale(1.02); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .chat-bubble.completed { opacity: 1; background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }
        
        .bubble-A { align-self: flex-start; background: #f1f5f9; border: 2px solid #cbd5e1; color: #334155; border-bottom-left-radius: 4px; text-align: left;}
        .bubble-B { align-self: flex-end; background: #e0f2fe; border: 2px solid var(--accent-theme); color: #0369a1; border-bottom-right-radius: 4px; text-align: right;}
        
        .role-label { font-family: 'Fredoka One'; font-size: 12px; margin-bottom: 4px; opacity: 0.7;}

        /* ไมโครโฟน */
        .mic-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 100px;}
        .mic-btn {
            width: 70px; height: 70px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #f87171, #ef4444); color: white; font-size: 30px;
            cursor: pointer; box-shadow: 0 6px 0 #b91c1c; transition: 0.1s; display: none;
            align-items: center; justify-content: center;
        }
        .mic-btn:active { transform: translateY(6px); box-shadow: none; }
        .mic-btn.listening { animation: pulse 1s infinite; background: linear-gradient(135deg, #facc15, #eab308); box-shadow: 0 6px 0 #a16207; }
        .mic-status { font-weight: bold; color: #64748b; font-size: 14px; display: none; text-align: center;}

        .role-selector { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;}
        .role-btn {
            flex: 1; padding: 15px; border-radius: 15px; border: 3px solid #cbd5e1;
            background: white; font-family: 'Fredoka One'; font-size: 20px; color: #64748b;
            cursor: pointer; transition: 0.2s;
        }
        .role-btn:hover { border-color: var(--main-theme); color: var(--main-theme); }
        .role-btn.selected { background: var(--main-theme); color: white; border-color: var(--dark-theme); box-shadow: 0 4px 10px rgba(14, 165, 233, 0.4);}

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240,249,255,0.9); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 30px; text-align: center; width: 100%; max-width: 340px; border: 4px solid var(--main-theme); box-shadow: 0 15px 30px rgba(3, 105, 161, 0.2); box-sizing: border-box; }
        .modal-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid var(--main-theme); border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        .modal-box input:focus { border-color: var(--dark-theme); }
        .btn-action { width: 100%; padding: 14px; background: var(--main-theme); color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; font-family: 'Sarabun'; box-shadow: 0 5px 0 var(--dark-theme); transition: 0.1s; font-size: 18px; }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }
        .score-num { font-size: 60px; font-weight: 900; color: var(--dark-theme); margin: 10px 0; display: block; line-height: 1;}

    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับ</button>
    </div>

    <div class="game-container" id="roleSelectionScreen" style="display: none;">
        <h1 class="header-title">Choose Your Role</h1>
        <p class="progress-text">เลือกบทบาทที่คุณต้องการเล่น</p>
        <div class="role-selector">
            <button class="role-btn" id="btnRoleA" onclick="selectRole('A')">Role A<br><span style="font-size:14px; font-family:'Sarabun'">(คนถาม)</span></button>
            <button class="role-btn" id="btnRoleB" onclick="selectRole('B')">Role B<br><span style="font-size:14px; font-family:'Sarabun'">(คนตอบ)</span></button>
        </div>
        <button class="btn-action" id="startConvoBtn" style="display:none;" onclick="startConversation()">🎬 เริ่มบทสนทนา</button>
    </div>

    <div class="game-container" id="conversationScreen" style="display: none;">
        <div class="progress-text" id="progressText">Person 1 / 8</div>
        
        <div class="person-display">
            <div class="large-image-frame">
                <img id="personImage" src="" alt="Person Image">
            </div>
            <p class="person-name" id="personName">Name</p>
            <p class="person-years" id="personYears">(0000 - 0000)</p>
        </div>

        <div class="chat-box" id="chatBox">
            <!-- Chat Bubbles -->
        </div>

        <div class="mic-container">
            <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
            <div class="mic-status" id="micStatus">แตะไมค์แล้วอ่านประโยคที่ไฮไลท์ให้ครบถ้วน</div>
            <button class="btn-switch" id="skipBtn" style="display:none; background:#94a3b8; margin-top:10px;" onclick="skipLine()">⏭️ ข้ามข้อนี้ (ไมค์ไม่ติด)</button>
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="color:var(--dark-theme); margin-top:0; font-size: 24px;">📝 ลงชื่อเข้าเรียน</h2>
            <p id="modalSub" style="color: #64748b; font-weight: 600; margin-top: 0; display:none; font-size: 14px;"></p>
            <input type="text" id="in_name" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-action" onclick="confirmUser()">🚀 เข้าสู่ระบบ</button>
        </div>
    </div>

    <!-- Modal สรุปคะแนน -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-theme); margin-top:0; font-size: 26px;">🎉 เก่งมาก!</h2>
            <p style="color: #64748b; font-weight: 600; margin-bottom: 0;">คะแนนของคุณคือ</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:30px; color:#94a3b8;">/8</span></span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d; min-height:22px;"></div>
            <button id="playAgainBtn" class="btn-action" onclick="restartGame()" style="display:none;">🔄 เล่นอีกครั้ง</button>
        </div>
    </div>

<script>
    // การปรับปรุงที่ 2: แยกประโยคของ B ออกเป็น 2 ตา (ตอบวันเกิดเสร็จ ค่อยสลับมาถามวันตาย)
    const dialoguesData = [
        { name: "Jesse Owens", years: "(1913-1980)", img: "Jesse_Owens.jpg", lines: [
            { role: "A", text: "When was Jesse Owens born?" },
            { role: "B", text: "In 1913." },
            { role: "B", text: "When did he die?" },
            { role: "A", text: "In 1980." }
        ]},
        { name: "Anna Pavlova", years: "(1881-1931)", img: "Anna_Pavlova.jpg", lines: [
            { role: "A", text: "When was Anna Pavlova born?" },
            { role: "B", text: "She was born in 1881." },
            { role: "B", text: "When did she die?" },
            { role: "A", text: "She died in 1931." }
        ]},
        { name: "Yuri Gagarin", years: "(1934-1968)", img: "Yuri_Gagarin.jpg", lines: [
            { role: "A", text: "When was Yuri Gagarin born?" },
            { role: "B", text: "He was born in 1934." },
            { role: "B", text: "When did he die?" },
            { role: "A", text: "He died in 1968." }
        ]},
        { name: "A. Fleming", years: "(1881-1955)", img: "Alexander_Fleming.jpg", lines: [
            { role: "A", text: "When was A. Fleming born?" },
            { role: "B", text: "He was born in 1881." },
            { role: "B", text: "When did he die?" },
            { role: "A", text: "He died in 1955." }
        ]},
        { name: "El Greco", years: "(1541-1614)", img: "El_Greco.jpg", lines: [
            { role: "A", text: "When was El Greco born?" },
            { role: "B", text: "He was born in 1541." },
            { role: "B", text: "When did he die?" },
            { role: "A", text: "He died in 1614." }
        ]},
        { name: "Marco Polo", years: "(1254-1324)", img: "Marco_Polo.jpg", lines: [
            { role: "A", text: "When was Marco Polo born?" },
            { role: "B", text: "He was born in 1254." },
            { role: "B", text: "When did he die?" },
            { role: "A", text: "He died in 1324." }
        ]},
        { name: "Florence Nightingale", years: "(1820-1910)", img: "Florence_Nightingale.jpg", lines: [
            { role: "A", text: "When was Florence Nightingale born?" },
            { role: "B", text: "She was born in 1820." },
            { role: "B", text: "When did she die?" },
            { role: "A", text: "She died in 1910." }
        ]},
        { name: "Albert Einstein", years: "(1879-1955)", img: "Albert_Einstein.jpg", lines: [
            { role: "A", text: "When was Albert Einstein born?" },
            { role: "B", text: "He was born in 1879." },
            { role: "B", text: "When did he die?" },
            { role: "A", text: "He died in 1955." }
        ]}
    ];

    const TOPIC_NAME = 'ม.1 Unit 7 Hall of fame Speaking';
    const MAX_Q = dialoguesData.length;
    let score = 0;
    let currentPersonIndex = 0;
    let currentLineIndex = 0;
    let userRole = '';
    let isSwitchingAccount = false;
    
    let recognition;
    let isRecording = false;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            checkSpeech(transcript);
        };
        recognition.onerror = function(event) {
            console.error("Speech Error:", event.error);
            stopMicUI();
            if(event.error === 'not-allowed') {
                Swal.fire('ข้อผิดพลาด', 'กรุณาอนุญาตการใช้ไมโครโฟน', 'error');
            } else {
                document.getElementById('micStatus').innerText = "ฟังไม่ถนัด กรุณากดไมค์แล้วพูดใหม่อีกครั้ง";
                document.getElementById('skipBtn').style.display = 'block'; 
            }
        };
        recognition.onend = function() { stopMicUI(); };
    }

    window.onload = () => { 
        if(!recognition) { Swal.fire('คำเตือน', 'เบราว์เซอร์นี้ไม่รองรับระบบตรวจจับเสียง กรุณาใช้ Google Chrome', 'warning'); }
        checkLoginStatus(); 
    };

    function selectRole(role) {
        userRole = role;
        document.getElementById('btnRoleA').classList.remove('selected');
        document.getElementById('btnRoleB').classList.remove('selected');
        document.getElementById(`btnRole${role}`).classList.add('selected');
        document.getElementById('startConvoBtn').style.display = 'block';
    }

    function startConversation() {
        document.getElementById('roleSelectionScreen').style.display = 'none';
        document.getElementById('conversationScreen').style.display = 'block';
        score = 0;
        currentPersonIndex = 0;
        
        // สลับคำถาม
        dialoguesData.sort(() => Math.random() - 0.5);
        loadPerson();
    }

    function loadPerson() {
        currentLineIndex = 0;
        document.getElementById('progressText').innerText = `Person ${currentPersonIndex + 1} / ${MAX_Q}`;
        const person = dialoguesData[currentPersonIndex];
        
        document.getElementById('personImage').src = person.img;
        document.getElementById('personName').innerText = person.name;
        document.getElementById('personYears').innerText = person.years;

        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';

        person.lines.forEach((line, index) => {
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${line.role === 'A' ? 'bubble-A' : 'bubble-B'}`;
            bubble.id = `bubble-${index}`;
            bubble.innerHTML = `<div class="role-label">${line.role}</div>${line.text}`;
            chatBox.appendChild(bubble);
        });

        document.getElementById('skipBtn').style.display = 'none';
        processLine();
    }

    function processLine() {
        const person = dialoguesData[currentPersonIndex];
        if (currentLineIndex >= person.lines.length) {
            score++;
            setTimeout(() => {
                currentPersonIndex++;
                if(currentPersonIndex < MAX_Q) loadPerson();
                else endGame();
            }, 1500);
            return;
        }

        const currentLine = person.lines[currentLineIndex];
        const bubble = document.getElementById(`bubble-${currentLineIndex}`);
        
        document.querySelectorAll('.chat-bubble').forEach(b => b.classList.remove('active'));
        bubble.classList.add('active');

        if (currentLine.role === userRole) {
            document.getElementById('micBtn').style.display = 'flex';
            document.getElementById('micStatus').style.display = 'block';
            document.getElementById('micStatus').innerText = "แตะไมค์ 🎤 แล้วอ่านประโยคที่ไฮไลท์ให้ครบทุกคำ";
        } else {
            document.getElementById('micBtn').style.display = 'none';
            document.getElementById('micStatus').style.display = 'none';
            playTTS(currentLine.text, () => {
                bubble.classList.add('completed');
                currentLineIndex++;
                processLine();
            });
        }
    }

    function toggleMic() {
        if(!recognition) return;
        if(isRecording) {
            recognition.stop();
        } else {
            recognition.start();
            document.getElementById('micBtn').classList.add('listening');
            document.getElementById('micStatus').innerText = "กำลังฟัง... พูดให้จบประโยคครับ";
            isRecording = true;
        }
    }

    function stopMicUI() {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('listening');
    }

    function checkSpeech(transcript) {
        const expectedText = dialoguesData[currentPersonIndex].lines[currentLineIndex].text;
        
        // การปรับปรุงที่ 3: ระบบตรวจเช็ค 100% Exact Match
        // ตัดเครื่องหมายวรรคตอน ตัดช่องว่างส่วนเกิน และแปลงเป็นพิมพ์เล็กทั้งหมดเพื่อเปรียบเทียบ
        const cleanSpoken = transcript.toLowerCase().replace(/[^a-z0-9\s]/g, "").trim().replace(/\s+/g, " ");
        const cleanExpected = expectedText.toLowerCase().replace(/[^a-z0-9\s]/g, "").trim().replace(/\s+/g, " ");

        // เช็คว่าประโยคที่พูด ตรงกับประโยคที่ต้องการแบบ 100% หรือไม่
        if (cleanSpoken === cleanExpected) {
            document.getElementById('micStatus').innerText = "✅ ถูกต้อง 100% เยี่ยมมากครับ!";
            document.getElementById('micBtn').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            
            const bubble = document.getElementById(`bubble-${currentLineIndex}`);
            bubble.classList.remove('active');
            bubble.classList.add('completed');
            
            setTimeout(() => {
                currentLineIndex++;
                processLine();
            }, 1000);
        } else {
            document.getElementById('micStatus').innerHTML = `❌ ยังไม่ถูกต้อง (ระบบได้ยินว่า: <i>"${transcript}"</i>)<br>กรุณากดไมค์และพูดใหม่ให้ครบทุกคำครับ`;
            document.getElementById('skipBtn').style.display = 'block';
        }
    }

    function skipLine() {
        const bubble = document.getElementById(`bubble-${currentLineIndex}`);
        bubble.classList.remove('active');
        bubble.classList.add('completed');
        document.getElementById('skipBtn').style.display = 'none';
        currentLineIndex++;
        processLine();
    }

    function playTTS(text, callback) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9; 
            utterance.onend = callback;
            utterance.onerror = callback; 
            window.speechSynthesis.speak(utterance);
        } else {
            setTimeout(callback, 1000); 
        }
    }

    function endGame() {
        if(!localStorage.getItem('studentId')) {
            document.getElementById('modalTitle').innerText = "👋 จบเกมแล้ว!";
            document.getElementById('modalSub').innerText = `คุณได้ ${score}/${MAX_Q} คะแนน กรอกข้อมูลเพื่อบันทึก`;
            document.getElementById('modalSub').style.display = 'block';
            document.getElementById('loginModal').classList.add('active');
        } else { 
            submitScore(); 
        }
    }

    function checkLoginStatus() {
        if(localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
            
            if(document.getElementById('conversationScreen').style.display === 'none') {
                document.getElementById('roleSelectionScreen').style.display = 'block';
            }
        } else {
            document.getElementById('userProfile').style.display = 'none';
            document.getElementById('roleSelectionScreen').style.display = 'none';
            document.getElementById('loginModal').classList.add('active');
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ เปลี่ยนคนเล่น?', text: "ข้อมูลเดิมจะถูกสลับออกนะ", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#ea580c', cancelButtonColor: '#9ca3af',
            confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if(res.isConfirmed) {
                localStorage.clear(); isSwitchingAccount = true;
                document.getElementById('in_name').value = ''; 
                document.getElementById('in_room').value = ''; 
                document.getElementById('in_id').value = '';
                document.getElementById('modalTitle').innerText = "🔄 ลงชื่อบัญชีใหม่";
                document.getElementById('modalSub').style.display = 'none';
                
                window.speechSynthesis.cancel();
                document.getElementById('conversationScreen').style.display = 'none';
                
                checkLoginStatus(); 
            }
        });
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        let nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
    });

    function confirmUser() {
        let n = document.getElementById('in_name').value.trim();
        let r = document.getElementById('in_room').value.trim();
        let id = document.getElementById('in_id').value.trim();
        if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัส 5 หลัก', 'warning'); return; }
        
        localStorage.setItem('studentName', n); 
        localStorage.setItem('studentRoom', r); 
        localStorage.setItem('studentId', id);
        
        document.getElementById('loginModal').classList.remove('active'); 
        
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id;

        if (isSwitchingAccount) { 
            isSwitchingAccount = false;
            document.getElementById('roleSelectionScreen').style.display = 'block';
        } else if (currentPersonIndex >= MAX_Q && score > 0) { 
            submitScore(); 
        } else {
            document.getElementById('roleSelectionScreen').style.display = 'block';
        }
    }

    function submitScore() {
        document.getElementById('conversationScreen').style.display = 'none';
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = score;
        const stat = document.getElementById('saveStatus');
        const playAgainBtn = document.getElementById('playAgainBtn');

        if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ ไม่พบไฟล์ตั้งค่า (quiz-config.js)"; 
            playAgainBtn.style.display = 'block'; return;
        }

        stat.innerText = "⏳ กำลังส่งคะแนน...";
        stat.style.color = "var(--dark-theme)";
        playAgainBtn.style.display = 'none';

        const payload = {
            name: localStorage.getItem('studentName'), 
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'), 
            lesson: TOPIC_NAME, 
            score: score, 
            maxScore: MAX_Q
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ บันทึกคะแนนลงระบบเรียบร้อย!"; 
            stat.style.color = "#15803d";
            playAgainBtn.style.display = 'block';
        }, 1500);
    }

    function restartGame() {
        document.getElementById('scoreModal').classList.remove('active');
        document.getElementById('roleSelectionScreen').style.display = 'block';
        userRole = '';
        document.getElementById('btnRoleA').classList.remove('selected');
        document.getElementById('btnRoleB').classList.remove('selected');
        document.getElementById('startConvoBtn').style.display = 'none';
    }
</script>
</body>
</html>
