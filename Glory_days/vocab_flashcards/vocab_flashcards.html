<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocabulary Flashcards - Unit 7</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>

    <style>
        :root {
            --main-theme: #0284c7; 
            --dark-theme: #0369a1; 
            --bg-color: #f0f9ff;
            --accent-theme: #f59e0b;
            --success: #22c55e;
            --success-dark: #16a34a;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 15px 10px;
            background-color: var(--bg-color);
            color: #334155;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #e0f2fe; border: 2px solid var(--main-theme);
            padding: 8px 15px; border-radius: 20px; color: var(--dark-theme); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; width: 100%; max-width: 800px; box-sizing: border-box;
        }
        .btn-switch { background: #f43f5e; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        .header-title { 
            font-family: 'Fredoka One', cursive; 
            color: var(--main-theme); 
            margin: 0 0 5px 0; 
            font-size: 32px;
            text-align: center;
        }
        
        .progress-text { 
            font-weight: 800; color: #0ea5e9; 
            margin-bottom: 5px; font-size: 16px; text-align: center; 
        }

        .instruction-text { text-align: center; font-size: 15px; font-weight: 800; color: #64748b; margin-bottom: 20px; }
        .status-counter { font-size: 18px; font-weight: 800; color: var(--success-dark); margin-bottom: 20px; text-align: center; }

        /* Grid จัดการ์ด */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%; max-width: 800px;
        }
        @media (min-width: 480px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }

        /* CSS สำหรับ 3D Flip Card */
        .card-scene {
            perspective: 1000px;
            width: 100%; height: 200px;
            position: relative;
        }

        .card-obj {
            width: 100%; height: 100%;
            transition: transform 0.6s, box-shadow 0.3s;
            transform-style: preserve-3d;
            position: relative;
            border-radius: 20px;
        }

        .card-obj.is-flipped {
            transform: rotateY(180deg);
        }

        /* ไฮไลท์เมื่อฝึกสำเร็จ (ฟังเสียง + พลิกดู) */
        .card-scene.studied .card-obj {
            box-shadow: 0 0 0 4px var(--success), 0 8px 16px rgba(34, 197, 94, 0.4);
        }

        .status-badge {
            position: absolute; top: -10px; right: -10px; background: white; border-radius: 50%;
            font-size: 20px; z-index: 10; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none;
        }
        .card-scene.studied .status-badge { display: block; animation: pop 0.3s ease-out; }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.15);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 15px; box-sizing: border-box; text-align: center;
            border: 3px solid transparent;
            cursor: pointer;
            transition: background-color 0.4s, border-color 0.4s;
        }

        /* พื้นหลังศิลปะ (ลายกระดาษอาร์ตอ่อนๆ) */
        .art-bg {
            background-color: #ffffff;
            background-image: url('https://www.transparenttextures.com/patterns/rice-paper-2.png');
        }

        /* หน้าการ์ด (ภาษาอังกฤษ) */
        .card-front {
            z-index: 2;
            transform: rotateY(0deg); 
        }
        
        .word-type { font-weight: 800; font-size: 14px; color: #64748b; margin-bottom: 10px; background: #e2e8f0; padding: 3px 10px; border-radius: 20px; text-transform: uppercase;}
        .vocab-text { font-family: 'Fredoka One', cursive; font-size: 26px; color: #0f172a; margin-bottom: 20px; text-shadow: 1px 1px 0px white;}
        
        /* ปุ่มลำโพง */
        .btn-audio {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white; border: none; width: 55px; height: 55px; border-radius: 50%;
            font-size: 26px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 0 #0369a1; transition: 0.2s; cursor: pointer; z-index: 5;
        }
        .btn-audio:active { transform: translateY(5px); box-shadow: none; }
        .btn-audio.played-glow { background: var(--success); box-shadow: 0 5px 0 var(--success-dark); }

        /* หลังการ์ด (ภาษาไทย) */
        .card-back {
            background: #f8fafc;
            transform: rotateY(180deg);
        }
        .thai-text { font-size: 26px; font-weight: 800; color: var(--dark-theme); margin-bottom: 10px;}
        .studied-mark { font-size: 16px; color: #10b981; font-weight: bold; background: #dcfce7; padding: 5px 15px; border-radius: 20px; margin-top: 15px; opacity: 0; transition: opacity 0.3s;}

        /* สถานะไฮไลท์เมื่อสำเร็จแล้ว (สีเขียว) */
        .card-scene.studied .card-front {
            background-color: #ecfdf5; 
            background-image: none;
            border-color: #34d399;
        }
        .card-scene.studied .card-back {
            background-color: #ecfdf5;
            border-color: #34d399;
        }
        .card-scene.studied .studied-mark { opacity: 1; }

        /* Submit Button */
        .btn-action { 
            width: 100%; max-width: 400px; margin: 30px auto 20px auto; background: var(--main-theme); color: white; font-weight: 800; font-size: 18px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 var(--dark-theme); transition: 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; 
        }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }

        /* Modal UI */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240,249,255,0.9); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 30px; text-align: center; width: 100%; max-width: 340px; border: 4px solid var(--main-theme); box-shadow: 0 15px 30px rgba(2, 132, 199, 0.2); box-sizing: border-box; }
        .modal-box input.login-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid var(--main-theme); border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        .modal-box input.login-input:focus { border-color: var(--dark-theme); }
        .score-num { font-size: 60px; font-weight: 900; color: var(--dark-theme); margin: 10px 0; display: block; line-height: 1;}

    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับบัญชี</button>
    </div>

    <h1 class="header-title">Vocabulary Flashcards</h1>
    <div class="progress-text">M.1 Unit 7 Glory days</div>
    <div class="instruction-text">กดฟังเสียง 🔊 และพลิกดูคำแปล 🔄 ให้ครบทุกใบ เพื่อรับคะแนน</div>
    <div class="status-counter" id="progressIndicator">ทบทวนสำเร็จ: 0 / 20</div>

    <div class="cards-grid" id="flashcardsContainer">
        <!-- การ์ดจะถูกสร้างด้วย JavaScript -->
    </div>

    <button class="btn-action" onclick="trySubmit()">✅ ส่งคะแนน</button>

    <!-- Modal Login -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="color:var(--dark-theme); margin-top:0; font-size: 24px;">📝 ลงชื่อใช้งาน</h2>
            <p id="modalSub" style="color: #64748b; font-weight: 600; margin-top: 0; font-size: 14px;"></p>
            <input type="text" id="in_name" class="login-input" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" class="login-input" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" class="login-input" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-action" id="btnSubmitLogin" onclick="confirmUser()" style="margin-top:5px; margin-bottom: 0;">🚀 ยืนยัน</button>
        </div>
    </div>

    <!-- Modal Score/Success -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark-theme); margin-top:0; font-size: 26px;">🎉 ส่งสำเร็จ!</h2>
            <p style="color: #64748b; font-weight: 600; margin-bottom: 0;">คะแนนทบทวนคำศัพท์ของคุณ</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:30px; color:#bae6fd;">/20</span></span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d; min-height:22px;"></div>
            <button class="btn-action" onclick="closeScoreModal()" style="margin-top:5px; margin-bottom: 0;">✅ ปิดและเริ่มใหม่</button>
        </div>
    </div>

<script>
    const TOPIC_NAME = 'ม.1 Unit 7 Glory days vocab flashcards';
    const vocabData = [
        { word: "be able to", type: "phr", thai: "สามารถ", audio: "be_able_to.mp3" },
        { word: "the most famous", type: "phr", thai: "มีชื่อเสียงที่สุด", audio: "the_most_famous.mp3" },
        { word: "Barcelona", type: "n", thai: "เมืองบาร์เซโลนา", audio: "barcelona.mp3" },
        { word: "Crete", type: "n", thai: "เกาะครีต", audio: "crete.mp3" },
        { word: "Seville", type: "n", thai: "เมืองเซบียา", audio: "seville.mp3" },
        { word: "Toledo", type: "n", thai: "เมืองโตเลโด", audio: "toledo.mp3" },
        { word: "artist", type: "n", thai: "ศิลปิน, จิตรกร", audio: "artist.mp3" },
        { word: "city", type: "n", thai: "เมือง, นคร", audio: "city.mp3" },
        { word: "dessert", type: "n", thai: "ขนมหวาน", audio: "dessert.mp3" },
        { word: "flour", type: "n", thai: "แป้งทำขนม/อาหาร", audio: "flour.mp3" },
        { word: "genius", type: "n", thai: "อัจฉริยะ", audio: "genius.mp3" },
        { word: "lake", type: "n", thai: "ทะเลสาบ", audio: "lake.mp3" },
        { word: "nickname", type: "n", thai: "ฉายา, ชื่อเล่น", audio: "nickname.mp3" },
        { word: "pasta", type: "n", thai: "พาสต้า", audio: "pasta.mp3" },
        { word: "professor", type: "n", thai: "ศาสตราจารย์", audio: "professor.mp3" },
        { word: "rice", type: "n", thai: "ข้าว", audio: "rice.mp3" },
        { word: "river", type: "n", thai: "แม่น้ำ", audio: "river.mp3" },
        { word: "real", type: "adj", thai: "แท้จริง", audio: "real.mp3" },
        { word: "better", type: "adj", thai: "ดีกว่า, เก่งกว่า", audio: "better.mp3" },
        { word: "greatest", type: "adj", thai: "ยิ่งใหญ่ที่สุด, ดีเยี่ยมที่สุด", audio: "greatest.mp3" }
    ];

    const MAX_SCORE = vocabData.length;
    let score = 0;
    let isSubmitting = false; 
    let currentAudio = null;
    let cardStates = {};

    document.addEventListener("DOMContentLoaded", () => {
        initGame();
        if(localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }
    });

    function initGame() {
        const container = document.getElementById('flashcardsContainer');
        container.innerHTML = '';
        cardStates = {};
        score = 0;
        if(currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
        
        document.getElementById('progressIndicator').innerText = `ทบทวนสำเร็จ: 0 / ${MAX_SCORE}`;

        // สุ่มเรียงคำศัพท์
        vocabData.sort(() => Math.random() - 0.5);

        vocabData.forEach((vocab, index) => {
            const id = `c_${index}`;
            cardStates[id] = { flipped: false, played: false, completed: false };
            
            const scene = document.createElement('div');
            scene.className = 'card-scene';
            scene.id = `scene-${id}`;

            scene.innerHTML = `
                <div class="status-badge" id="badge-${id}">✅</div>
                <div class="card-obj" id="card-${id}">
                    <div class="card-face card-front art-bg" onclick="handleFlip('${id}')">
                        <div class="word-type">${vocab.type}</div>
                        <div class="vocab-text">${vocab.word}</div>
                        <button class="btn-audio" id="audio-btn-${id}" onclick="playAudio(event, '${id}', '${vocab.audio}')">🔊</button>
                    </div>
                    <div class="card-face card-back" onclick="handleFlip('${id}')">
                        <div class="thai-text">${vocab.thai}</div>
                        <div class="studied-mark">✔️ ทบทวนแล้ว</div>
                    </div>
                </div>
            `;
            container.appendChild(scene);
        });
    }

    function handleFlip(id) {
        const cardObj = document.getElementById(`card-${id}`);
        cardObj.classList.toggle('is-flipped');

        if (!cardStates[id].flipped) {
            cardStates[id].flipped = true;
            checkCardComplete(id);
        }
    }

    function playAudio(event, id, audioSrc) {
        event.stopPropagation();
        if(currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }
        currentAudio = new Audio(audioSrc);
        currentAudio.play().catch(e => console.log("รอไฟล์เสียงอัปโหลด..."));

        if (!cardStates[id].played) {
            cardStates[id].played = true;
            document.getElementById(`audio-btn-${id}`).classList.add('played-glow');
            checkCardComplete(id);
        }
    }

    function checkCardComplete(id) {
        if (cardStates[id].flipped && cardStates[id].played && !cardStates[id].completed) {
            cardStates[id].completed = true;
            document.getElementById(`scene-${id}`).classList.add('studied');
            playSoundMiniSuccess();
            
            // อัปเดต Progress
            score = calculateScore();
            document.getElementById('progressIndicator').innerText = `ทบทวนสำเร็จ: ${score} / ${MAX_SCORE}`;

            // ยิงพลุเมื่อครบทุกใบ
            if (score === MAX_SCORE) {
                setTimeout(fireConfetti, 500);
            }
        }
    }

    function calculateScore() {
        return Object.values(cardStates).filter(state => state.completed).length;
    }

    function trySubmit() {
        score = calculateScore();
        if (score < MAX_SCORE) {
            Swal.fire({
                title: 'ยังฝึกไม่ครบ!',
                html: `หนูทบทวนสำเร็จไป <b>${score}</b> คำ จากทั้งหมด <b>${MAX_SCORE}</b> คำ<br>(ต้องกดฟังเสียง 🔊 และพลิกดูคำแปล 🔄 ให้ครบ)<br><br><i>ต้องการส่งคะแนนเท่านี้ หรือกลับไปฝึกต่อ?</i>`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#f43f5e',
                cancelButtonColor: '#0284c7',
                confirmButtonText: 'ยืนยันส่งคะแนน',
                cancelButtonText: 'กลับไปฝึกให้ครบ'
            }).then((result) => {
                if (result.isConfirmed) proceedToLogin();
            });
        } else {
            proceedToLogin();
        }
    }

    function proceedToLogin() {
        if(!localStorage.getItem('studentId')) {
            isSubmitting = true; 
            document.getElementById('modalSub').innerText = `คะแนนที่ทำได้คือ ${score}/${MAX_SCORE}\nลงชื่อเพื่อบันทึกคะแนน`;
            document.getElementById('btnSubmitLogin').innerText = "🚀 บันทึกคะแนน";
            document.getElementById('loginModal').classList.add('active');
        } else {
            submitScore();
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ สลับบัญชี?', text: "เปลี่ยนคนเล่น สถานะการฝึกจะถูกล้างใหม่", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#0284c7', cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if(res.isConfirmed) {
                localStorage.clear(); 
                document.getElementById('userProfile').style.display = 'none';
                
                isSubmitting = false; 
                
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                
                document.getElementById('modalSub').innerText = "ลงชื่อเข้าใช้งานสำหรับนักเรียนคนใหม่ (กดตกลงเพื่อเริ่มฝึก)";
                document.getElementById('btnSubmitLogin').innerText = "🚀 เริ่มฝึกทบทวน";
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        let nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
    });

    function confirmUser() {
        let n = document.getElementById('in_name').value.trim();
        let r = document.getElementById('in_room').value.trim();
        let id = document.getElementById('in_id').value.trim();
        if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัส 5 หลัก', 'warning'); return; }
        
        localStorage.setItem('studentName', n); 
        localStorage.setItem('studentRoom', r); 
        localStorage.setItem('studentId', id);
        
        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id; 
        
        if (isSubmitting) {
            submitScore();
        } else {
            initGame(); 
        }
    }

    function submitScore() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = score;
        const stat = document.getElementById('saveStatus');
        
        if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ ไม่พบไฟล์ตั้งค่า (quiz-config.js)"; 
            return;
        }

        stat.innerText = "⏳ กำลังบันทึกคะแนน...";

        const payload = {
            name: localStorage.getItem('studentName'), 
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'), 
            lesson: TOPIC_NAME, score: score, maxScore: MAX_SCORE
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ บันทึกคะแนนลงระบบเรียบร้อย!"; 
            playSoundSuccess();
        }, 1500);
    }

    function closeScoreModal() {
        document.getElementById('scoreModal').classList.remove('active');
        initGame();
    }

    function fireConfetti() {
        var duration = 3 * 1000;
        var end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#0284c7', '#f59e0b', '#10b981'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#0284c7', '#f59e0b', '#10b981'] });
            if (Date.now() < end) { requestAnimationFrame(frame); }
        }());
    }

    function playSoundMiniSuccess() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
