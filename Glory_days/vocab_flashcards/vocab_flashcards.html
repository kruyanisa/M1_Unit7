<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocabulary Flashcards - Unit 7</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --main-theme: #0284c7; /* สีฟ้าน้ำทะเล */
            --dark-theme: #0369a1; 
            --bg-color: #f0f9ff;
            --accent-theme: #f59e0b;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 15px 10px;
            background-color: var(--bg-color);
            color: #334155;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .header-title { 
            font-family: 'Fredoka One', cursive; 
            color: var(--main-theme); 
            margin: 0 0 5px 0; 
            font-size: 32px;
            text-align: center;
        }
        
        .progress-text { 
            font-weight: 800; color: #0ea5e9; 
            margin-bottom: 20px; font-size: 16px; text-align: center; 
        }

        .controls {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 800px; margin-bottom: 20px;
            background: white; padding: 12px 20px; border-radius: 15px;
            border: 2px solid #bae6fd; box-sizing: border-box;
        }
        
        .status-counter { font-size: 17px; font-weight: 800; color: #10b981; }

        .btn-reset { 
            background: #f43f5e; color: white; border: none; 
            padding: 8px 15px; border-radius: 12px; cursor: pointer; 
            font-family: 'Sarabun'; font-weight: bold; font-size: 15px;
            box-shadow: 0 4px 0 #be123c; transition: 0.1s;
        }
        .btn-reset:active { transform: translateY(4px); box-shadow: none; }

        /* Grid จัดการ์ด */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%; max-width: 800px;
        }
        @media (min-width: 480px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }

        /* CSS สำหรับ 3D Flip Card */
        .card-scene {
            perspective: 1000px;
            width: 100%; height: 200px; /* ลดความสูงลงนิดหน่อยเพราะไม่มีปุ่มด้านหลังแล้ว */
        }

        .card-obj {
            width: 100%; height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
        }

        .card-obj.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.15);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 15px; box-sizing: border-box; text-align: center;
            border: 3px solid transparent;
            cursor: pointer;
            transition: background-color 0.4s;
        }

        /* พื้นหลังศิลปะ (ลายกระดาษอาร์ตอ่อนๆ) */
        .art-bg {
            background-color: #ffffff;
            background-image: url('https://www.transparenttextures.com/patterns/rice-paper-2.png');
        }

        /* หน้าการ์ด (ภาษาอังกฤษ) */
        .card-front {
            z-index: 2;
            transform: rotateY(0deg); 
        }
        
        .word-type { font-weight: 800; font-size: 14px; color: #64748b; margin-bottom: 10px; background: #e2e8f0; padding: 3px 10px; border-radius: 20px; text-transform: uppercase;}
        .vocab-text { font-family: 'Fredoka One'; font-size: 26px; color: #0f172a; margin-bottom: 20px; text-shadow: 1px 1px 0px white;}
        
        /* ปุ่มลำโพง */
        .btn-audio {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white; border: none; width: 55px; height: 55px; border-radius: 50%;
            font-size: 26px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 0 #0369a1; transition: 0.1s; cursor: pointer;
        }
        .btn-audio:active { transform: translateY(5px); box-shadow: none; }

        /* หลังการ์ด (ภาษาไทย) */
        .card-back {
            background: #f8fafc;
            transform: rotateY(180deg);
        }
        .thai-text { font-size: 26px; font-weight: 800; color: var(--dark-theme); margin-bottom: 10px;}
        .studied-mark { font-size: 16px; color: #10b981; font-weight: bold; background: #dcfce7; padding: 5px 15px; border-radius: 20px; margin-top: 15px; opacity: 0; transition: opacity 0.3s;}

        /* สถานะไฮไลท์เมื่อกดพลิกแล้ว (สีเขียว) */
        .card-scene.studied .card-front {
            background-color: #ecfdf5; /* เปลี่ยนสีพื้นเป็นสีเขียวอ่อน */
            background-image: none;
            border-color: #34d399;
        }
        .card-scene.studied .card-back {
            background-color: #ecfdf5;
            border-color: #34d399;
        }
        .card-scene.studied .studied-mark { opacity: 1; }

    </style>
</head>
<body>

    <h1 class="header-title">Vocabulary Flashcards</h1>
    <div class="progress-text">M.1 Unit 7 Glory days</div>

    <div class="controls">
        <div class="status-counter">ฝึกแล้ว: <span id="studiedCount">0</span> / 20</div>
        <button class="btn-reset" onclick="resetAllCards()">🔄 เริ่มใหม่ทั้งหมด</button>
    </div>

    <div class="cards-grid" id="flashcardsContainer">
        <!-- การ์ดจะถูกสร้างด้วย JavaScript -->
    </div>

<script>
    const vocabData = [
        { word: "be able to", type: "phr", thai: "สามารถ", audio: "be_able_to.mp3" },
        { word: "the most famous", type: "phr", thai: "มีชื่อเสียงที่สุด", audio: "the_most_famous.mp3" },
        { word: "Barcelona", type: "n", thai: "เมืองบาร์เซโลนา", audio: "barcelona.mp3" },
        { word: "Crete", type: "n", thai: "เกาะครีต", audio: "crete.mp3" },
        { word: "Seville", type: "n", thai: "เมืองเซบียา", audio: "seville.mp3" },
        { word: "Toledo", type: "n", thai: "เมืองโตเลโด", audio: "toledo.mp3" },
        { word: "artist", type: "n", thai: "ศิลปิน, จิตรกร", audio: "artist.mp3" },
        { word: "city", type: "n", thai: "เมือง, นคร", audio: "city.mp3" },
        { word: "dessert", type: "n", thai: "ขนมหวาน", audio: "dessert.mp3" },
        { word: "flour", type: "n", thai: "แป้งทำขนม/อาหาร", audio: "flour.mp3" },
        { word: "genius", type: "n", thai: "อัจฉริยะ", audio: "genius.mp3" },
        { word: "lake", type: "n", thai: "ทะเลสาบ", audio: "lake.mp3" },
        { word: "nickname", type: "n", thai: "ฉายา, ชื่อเล่น", audio: "nickname.mp3" },
        { word: "pasta", type: "n", thai: "พาสต้า", audio: "pasta.mp3" },
        { word: "professor", type: "n", thai: "ศาสตราจารย์", audio: "professor.mp3" },
        { word: "rice", type: "n", thai: "ข้าว", audio: "rice.mp3" },
        { word: "river", type: "n", thai: "แม่น้ำ", audio: "river.mp3" },
        { word: "real", type: "adj", thai: "แท้จริง", audio: "real.mp3" },
        { word: "better", type: "adj", thai: "ดีกว่า, เก่งกว่า", audio: "better.mp3" },
        { word: "greatest", type: "adj", thai: "ยิ่งใหญ่ที่สุด, ดีเยี่ยมที่สุด", audio: "greatest.mp3" }
    ];

    let studiedTotal = 0;

    window.onload = () => {
        renderCards();
    };

    function renderCards() {
        const container = document.getElementById('flashcardsContainer');
        container.innerHTML = '';

        vocabData.forEach((vocab, index) => {
            const scene = document.createElement('div');
            scene.className = 'card-scene';
            scene.id = `scene-${index}`;

            const cardObj = document.createElement('div');
            cardObj.className = 'card-obj';
            cardObj.id = `card-${index}`;

            // โซนหน้าการ์ด (อังกฤษ)
            const front = document.createElement('div');
            front.className = 'card-face card-front art-bg';
            
            // คลิกหน้าการ์ดเพื่อพลิก และนับคะแนนทันที!
            front.onclick = (e) => {
                cardObj.classList.add('is-flipped');
                markAsStudied(index); // เรียกฟังก์ชันนับคะแนน
            };

            front.innerHTML = `
                <div class="word-type">${vocab.type}</div>
                <div class="vocab-text">${vocab.word}</div>
            `;

            // ปุ่มลำโพง
            const audioBtn = document.createElement('button');
            audioBtn.className = 'btn-audio';
            audioBtn.innerHTML = '🔊';
            audioBtn.onclick = (e) => {
                e.stopPropagation(); // หยุดไม่ให้คลิกทะลุไปพลิกการ์ดเวลาจิ้มลำโพง
                playAudio(vocab.audio);
            };
            front.appendChild(audioBtn);

            // โซนหลังการ์ด (ไทย)
            const back = document.createElement('div');
            back.className = 'card-face card-back';
            
            // คลิกหลังการ์ดเพื่อพลิกกลับไปหน้าแรก
            back.onclick = (e) => {
                cardObj.classList.remove('is-flipped');
            };

            back.innerHTML = `
                <div class="thai-text">${vocab.thai}</div>
                <div class="studied-mark">✔️ ผ่านแล้ว</div>
            `;

            cardObj.appendChild(front);
            cardObj.appendChild(back);
            scene.appendChild(cardObj);
            container.appendChild(scene);
        });
    }

    // ฟังก์ชันเล่นเสียง MP3
    function playAudio(audioFileName) {
        const audio = new Audio(audioFileName);
        audio.play().catch(error => {
            console.error("ไม่พบไฟล์เสียง:", audioFileName);
        });
    }

    // ฟังก์ชันนับคะแนน (ทำงานอัตโนมัติเมื่อกดพลิกการ์ด)
    function markAsStudied(index) {
        const scene = document.getElementById(`scene-${index}`);
        
        // ถ้ายอมยังไม่เคยถูกพลิก (ยังไม่มีคลาส studied) ให้นับเพิ่ม 1
        if (!scene.classList.contains('studied')) {
            scene.classList.add('studied');
            studiedTotal++;
            updateCounter();
            
            // จุดพลุเมื่อพลิกครบทุกใบ
            if(studiedTotal === vocabData.length) {
                setTimeout(fireConfetti, 500); // หน่วงเวลาครึ่งวิ ให้การ์ดพลิกเสร็จก่อนพลุแตก
            }
        }
    }

    function updateCounter() {
        document.getElementById('studiedCount').innerText = studiedTotal;
    }

    // ปุ่มเริ่มใหม่ แก้บั๊กให้ทำงานได้ 100%
    window.resetAllCards = function() {
        Swal.fire({
            title: 'เริ่มใหม่ทั้งหมด?',
            text: "ระบบจะล้างความคืบหน้ากลับไปเป็น 0 / 20",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#0284c7',
            cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ตกลง, เริ่มใหม่!',
            cancelButtonText: 'ยกเลิก'
        }).then((result) => {
            if (result.isConfirmed) {
                // รีเซ็ตตัวเลข
                studiedTotal = 0;
                updateCounter();
                
                // ล้างคลาสไฮไลท์สีเขียว และพลิกการ์ดกลับทั้งหมด
                for (let i = 0; i < vocabData.length; i++) {
                    const scene = document.getElementById(`scene-${i}`);
                    const cardObj = document.getElementById(`card-${i}`);
                    
                    if (scene && cardObj) {
                        scene.classList.remove('studied');
                        cardObj.classList.remove('is-flipped');
                    }
                }
            }
        });
    };

    function fireConfetti() {
        var duration = 3 * 1000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#0284c7', '#f59e0b', '#10b981'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#0284c7', '#f59e0b', '#10b981'] });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }
</script>
</body>
</html>
