<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glory Days - Vocabulary Jobs</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://kruyanisa.github.io/classroom-core/quiz-config.js"></script>
    
    <style>
        :root {
            --main: #f97316;
            --dark: #c2410c; 
            --bg-color: #fff7ed;
            --card-front: #ffffff;
            --card-back: #ffedd5;
            --success: #22c55e;
            --success-dark: #16a34a;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0; padding: 15px;
            background-color: var(--bg-color);
            color: #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .profile-bar {
            font-size: clamp(12px, 3.5vw, 14px); background: #ffedd5; border: 2px solid var(--main);
            padding: 8px 15px; border-radius: 20px; color: var(--dark); font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; width: 100%; max-width: 900px; box-sizing: border-box;
        }
        .btn-switch { background: #f43f5e; color: white; border: none; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; }

        .container { width: 100%; max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(249, 115, 22, 0.1); box-sizing: border-box;}

        .header-title { font-family: 'Fredoka One', cursive; color: var(--main); text-align: center; margin: 5px 0 5px 0; font-size: 32px;}
        .sub-title { text-align: center; font-weight: 800; color: #64748b; margin-top: 0; margin-bottom: 5px; font-size: 16px;}
        .progress-indicator { text-align: center; font-size: 18px; font-weight: bold; color: var(--success-dark); margin-bottom: 20px; }

        /* Grid Layout */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        /* 3D Flipcard CSS */
        .flip-card {
            background-color: transparent;
            width: 100%;
            height: 230px;
            perspective: 1000px;
            cursor: pointer;
            position: relative;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s, box-shadow 0.3s;
            transform-style: preserve-3d;
            border-radius: 20px;
        }

        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }

        /* ไฮไลท์สีเขียวเมื่อฝึกสำเร็จ */
        .flip-card.completed-highlight .flip-card-inner {
            box-shadow: 0 0 0 4px var(--success), 0 8px 16px rgba(34, 197, 94, 0.4);
        }
        .flip-card.completed-highlight .flip-card-front, 
        .flip-card.completed-highlight .flip-card-back {
            border-color: var(--success);
        }
        .flip-card.completed-highlight .play-btn-zone {
            color: var(--success); border-color: #bbf7d0; background: #dcfce7;
        }

        .status-badge {
            position: absolute; top: -10px; right: -10px; background: white; border-radius: 50%;
            font-size: 20px; z-index: 10; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none;
        }
        .flip-card.completed-highlight .status-badge { display: block; animation: pop 0.3s ease-out; }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border: 3px solid #fdba74;
            padding: 10px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .flip-card-front {
            background-color: var(--card-front);
            color: var(--dark);
        }
        
        .card-img {
            width: 105px; height: 105px; object-fit: contain; margin-bottom: 8px;
            border-radius: 50%; border: 3px solid #fed7aa; pointer-events: none;
        }
        
        .word-en {
            font-family: 'Fredoka One', cursive; font-size: 20px; margin-bottom: 5px; pointer-events: none;
        }
        
        .play-btn-zone {
            display: flex; justify-content: center; align-items: center;
            width: 40px; height: 40px; background: #fff7ed; border-radius: 50%;
            font-size: 20px; color: var(--main); transition: 0.2s;
            border: 2px solid #fed7aa; margin-top: auto; z-index: 5;
        }
        .play-btn-zone:active { background: #fed7aa; transform: scale(0.9); }

        .flip-card-back {
            background-color: var(--card-back);
            color: var(--dark);
            transform: rotateY(180deg);
        }

        .word-th { font-weight: 800; font-size: 24px; line-height: 1.4; }

        /* Submit Button */
        .btn-action { 
            width: 100%; max-width: 400px; margin: 30px auto 10px auto; background: var(--main); color: white; font-weight: 800; font-size: 18px; padding: 15px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 var(--dark); transition: 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; 
        }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }

        /* Modal UI */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,247,237,0.9); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px 20px; border-radius: 30px; text-align: center; width: 100%; max-width: 340px; border: 4px solid var(--main); box-shadow: 0 15px 30px rgba(249, 115, 22, 0.2); box-sizing: border-box; }
        .modal-box input.login-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid var(--main); border-radius: 15px; text-align: center; font-family: 'Sarabun'; font-size: 16px; font-weight: 600; box-sizing: border-box; outline: none; }
        .modal-box input.login-input:focus { border-color: var(--dark); }
        .score-num { font-size: 60px; font-weight: 900; color: var(--dark); margin: 10px 0; display: block; line-height: 1;}

        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .flip-card { height: 200px; }
            .card-img { width: 85px; height: 85px; }
            .word-en { font-size: 18px; }
            .word-th { font-size: 20px; }
            .play-btn-zone { width: 35px; height: 35px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="userProfile" class="profile-bar" style="display:none;">
        <span>👤 <span id="p_name"></span> | 🏫 <span id="p_room"></span> | 🆔 <span id="p_id"></span></span>
        <button class="btn-switch" onclick="switchAccount()">🔄 สลับบัญชี</button>
    </div>

    <div class="container" id="gameContainer">
        <h1 class="header-title">Glory Days</h1>
        <h2 class="sub-title">Vocabulary: Jobs</h2>
        <div class="sub-title" style="color: #ea580c; font-weight: 600;">(แตะลำโพง 🔊 และแตะการ์ดเพื่อดูคำแปล 🔄 ให้ครบทุกใบ)</div>
        
        <div class="progress-indicator" id="progressIndicator">ทบทวนสำเร็จ: 0 / 9</div>

        <div class="cards-grid" id="cardGrid"></div>

        <button class="btn-action" onclick="trySubmit()">✅ ส่งคะแนน</button>
    </div>

    <!-- Modal Login -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2 id="modalTitle" style="color:var(--dark); margin-top:0; font-size: 24px;">📝 ลงชื่อใช้งาน</h2>
            <p id="modalSub" style="color: #64748b; font-weight: 600; margin-top: 0; font-size: 14px;"></p>
            <input type="text" id="in_name" class="login-input" placeholder="ชื่อ - นามสกุล">
            <input type="text" id="in_room" class="login-input" placeholder="ชั้น/ห้อง (เช่น 1/1)">
            <input type="text" id="in_id" class="login-input" placeholder="รหัสนักเรียน (5 หลัก)" maxlength="5">
            <button class="btn-action" id="btnSubmitLogin" onclick="confirmUser()" style="margin-top:5px; margin-bottom: 0;">🚀 ยืนยัน</button>
        </div>
    </div>

    <!-- Modal Score/Success -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <h2 style="color:var(--dark); margin-top:0; font-size: 26px;">🎉 ส่งสำเร็จ!</h2>
            <p style="color: #64748b; font-weight: 600; margin-bottom: 0;">คะแนนทบทวนคำศัพท์ของคุณ</p>
            <span class="score-num"><span id="finalScoreText">0</span><span style="font-size:30px; color:#fdba74;">/9</span></span>
            <div id="saveStatus" style="font-weight:bold; font-size:15px; margin-bottom:15px; color:#15803d; min-height:22px;"></div>
            <button class="btn-action" onclick="closeScoreModal()" style="margin-top:5px; margin-bottom: 0;">✅ ปิดและเริ่มใหม่</button>
        </div>
    </div>

<script>
    const TOPIC_NAME = 'ม.1 Unit 7 Glory days Vocabjobs';
    const vocabList = [
        { id: "singer", en: "singer", th: "นักร้อง", img: "singer.jpg", audio: "singer.mp3" },
        { id: "scientist", en: "scientist", th: "นักวิทยาศาสตร์", img: "scientist.jpg", audio: "scientist.mp3" },
        { id: "athlete", en: "athlete", th: "นักกีฬา", img: "athlete.jpg", audio: "athlete.mp3" },
        { id: "astronaut", en: "astronaut", th: "นักบินอวกาศ", img: "astronaut.jpg", audio: "astronaut.mp3" },
        { id: "painter", en: "painter", th: "จิตรกร", img: "painter.jpg", audio: "painter.mp3" },
        { id: "ballerina", en: "ballerina", th: "นักเต้นบัลเลต์", img: "ballerina.jpg", audio: "ballerina.mp3" },
        { id: "inventor", en: "inventor", th: "นักประดิษฐ์", img: "inventor.jpg", audio: "inventor.mp3" },
        { id: "nurse", en: "nurse", th: "พยาบาล", img: "nurse.jpg", audio: "nurse.mp3" },
        { id: "explorer", en: "explorer", th: "นักสำรวจ", img: "explorer.jpg", audio: "explorer.mp3" }
    ];
    
    const MAX_SCORE = vocabList.length;
    let score = 0;
    let isSubmitting = false; 
    let currentAudio = null;
    let cardStates = {};

    document.addEventListener("DOMContentLoaded", () => {
        initGame();
        if(localStorage.getItem('studentId')) {
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('p_name').innerText = localStorage.getItem('studentName');
            document.getElementById('p_room').innerText = localStorage.getItem('studentRoom');
            document.getElementById('p_id').innerText = localStorage.getItem('studentId'); 
        }
    });

    function initGame() {
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = '';
        cardStates = {};
        score = 0;
        if(currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
        
        document.getElementById('progressIndicator').innerText = `ทบทวนสำเร็จ: 0 / ${MAX_SCORE}`;

        // สุ่มเรียงคำศัพท์
        vocabList.sort(() => Math.random() - 0.5);

        vocabList.forEach(item => {
            cardStates[item.id] = { flipped: false, played: false, completed: false };
            
            let card = document.createElement('div');
            card.className = "flip-card";
            card.id = `card-${item.id}`;
            card.innerHTML = `
                <div class="status-badge" id="badge-${item.id}">✅</div>
                <div class="flip-card-inner" id="inner-${item.id}">
                    <div class="flip-card-front">
                        <img src="${item.img}" alt="${item.en}" class="card-img" onerror="this.src='https://placehold.co/100?text=Job'">
                        <div class="word-en">${item.en}</div>
                        <div class="play-btn-zone" id="audio-btn-${item.id}" onclick="playAudio(event, '${item.id}', '${item.audio}')">🔊</div>
                    </div>
                    <div class="flip-card-back">
                        <div class="word-th">${item.th}</div>
                    </div>
                </div>
            `;
            
            // เพิ่ม Event Listener ให้คลิกพลิกการ์ด (ยกเว้นตรงลำโพง)
            card.querySelector('.flip-card-front').addEventListener('click', (e) => {
                if (!e.target.closest('.play-btn-zone')) {
                    handleFlip(item.id);
                }
            });
            card.querySelector('.flip-card-back').addEventListener('click', () => {
                handleFlip(item.id);
            });

            grid.appendChild(card);
        });
    }

    function handleFlip(id) {
        const cardInner = document.getElementById(`inner-${id}`);
        cardInner.parentElement.classList.toggle('flipped');

        if (!cardStates[id].flipped) {
            cardStates[id].flipped = true;
            checkCardComplete(id);
        }
    }

    function playAudio(event, id, audioSrc) {
        event.stopPropagation();
        if(currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }
        currentAudio = new Audio(audioSrc);
        currentAudio.play().catch(e => console.log("รอไฟล์เสียงอัปโหลด..."));

        if (!cardStates[id].played) {
            cardStates[id].played = true;
            checkCardComplete(id);
        }
    }

    function checkCardComplete(id) {
        if (cardStates[id].flipped && cardStates[id].played && !cardStates[id].completed) {
            cardStates[id].completed = true;
            document.getElementById(`card-${id}`).classList.add('completed-highlight');
            playSoundMiniSuccess();
            
            // อัปเดต Progress
            const currentCount = calculateScore();
            document.getElementById('progressIndicator').innerText = `ทบทวนสำเร็จ: ${currentCount} / ${MAX_SCORE}`;
        }
    }

    function calculateScore() {
        return Object.values(cardStates).filter(state => state.completed).length;
    }

    function trySubmit() {
        score = calculateScore();
        if (score < MAX_SCORE) {
            Swal.fire({
                title: 'ยังฝึกไม่ครบ!',
                html: `หนูทบทวนสำเร็จไป <b>${score}</b> คำ จากทั้งหมด <b>${MAX_SCORE}</b> คำ<br>(ต้องกดฟังเสียง 🔊 และพลิกดูคำแปล 🔄 ให้ครบ)<br><br><i>ต้องการส่งคะแนนเท่านี้ หรือกลับไปฝึกต่อ?</i>`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#f43f5e',
                cancelButtonColor: '#f97316',
                confirmButtonText: 'ยืนยันส่งคะแนน',
                cancelButtonText: 'กลับไปฝึกให้ครบ'
            }).then((result) => {
                if (result.isConfirmed) proceedToLogin();
            });
        } else {
            proceedToLogin();
        }
    }

    function proceedToLogin() {
        if(!localStorage.getItem('studentId')) {
            isSubmitting = true; 
            document.getElementById('modalSub').innerText = `คะแนนที่ทำได้คือ ${score}/${MAX_SCORE}\nลงชื่อเพื่อบันทึกคะแนน`;
            document.getElementById('btnSubmitLogin').innerText = "🚀 บันทึกคะแนน";
            document.getElementById('loginModal').classList.add('active');
        } else {
            submitScore();
        }
    }

    function switchAccount() {
        Swal.fire({
            title: '⚠️ สลับบัญชี?', text: "เปลี่ยนคนเล่น สถานะการฝึกจะถูกล้างใหม่", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#f97316', cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก'
        }).then((res) => {
            if(res.isConfirmed) {
                localStorage.clear(); 
                document.getElementById('userProfile').style.display = 'none';
                
                isSubmitting = false; 
                
                document.getElementById('in_name').value = '';
                document.getElementById('in_room').value = '';
                document.getElementById('in_id').value = '';
                
                document.getElementById('modalSub').innerText = "ลงชื่อเข้าใช้งานสำหรับนักเรียนคนใหม่ (กดตกลงเพื่อเริ่มฝึก)";
                document.getElementById('btnSubmitLogin').innerText = "🚀 เริ่มฝึกทบทวน";
                document.getElementById('loginModal').classList.add('active');
            }
        });
    }

    document.getElementById('in_room').addEventListener('blur', function() {
        let nums = this.value.match(/\d+/g);
        if (nums && nums.length >= 2) this.value = `ม.${nums[0]}/${nums[1]}`;
        else if (nums && nums.length === 1) this.value = `ม.1/${nums[0]}`;
    });

    function confirmUser() {
        let n = document.getElementById('in_name').value.trim();
        let r = document.getElementById('in_room').value.trim();
        let id = document.getElementById('in_id').value.trim();
        if(!n || !r || id.length !== 5) { Swal.fire('ข้อมูลไม่ครบ!', 'กรุณากรอกชื่อ ห้อง และรหัส 5 หลัก', 'warning'); return; }
        
        localStorage.setItem('studentName', n); 
        localStorage.setItem('studentRoom', r); 
        localStorage.setItem('studentId', id);
        
        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('userProfile').style.display = 'flex';
        document.getElementById('p_name').innerText = n;
        document.getElementById('p_room').innerText = r;
        document.getElementById('p_id').innerText = id; 
        
        if (isSubmitting) {
            submitScore();
        } else {
            initGame(); 
        }
    }

    function submitScore() {
        document.getElementById('scoreModal').classList.add('active');
        document.getElementById('finalScoreText').innerText = score;
        const stat = document.getElementById('saveStatus');
        
        if(typeof QUIZ_CONFIG === 'undefined' || !QUIZ_CONFIG.SCRIPT_URL) {
            stat.innerText = "❌ ไม่พบไฟล์ตั้งค่า (quiz-config.js)"; 
            return;
        }

        stat.innerText = "⏳ กำลังบันทึกคะแนน...";

        const payload = {
            name: localStorage.getItem('studentName'), 
            room: localStorage.getItem('studentRoom'),
            studentId: "'" + localStorage.getItem('studentId'), 
            lesson: TOPIC_NAME, score: score, maxScore: MAX_SCORE
        };

        fetch(QUIZ_CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .catch(e => console.error(e));

        setTimeout(() => {
            stat.innerText = "✅ บันทึกคะแนนลงระบบเรียบร้อย!"; 
            playSoundSuccess();
        }, 1500);
    }

    function closeScoreModal() {
        document.getElementById('scoreModal').classList.remove('active');
        initGame();
    }

    function playSoundMiniSuccess() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    function playSoundSuccess() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } catch(e) {}
    }
</script>

</body>
</html>
